     Интерфейсы, субтитры, плашки времени, дождь — рисуются кодом. -->
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #05060d; }
  canvas { display: block; }
  @font-face { font-family: 'Inter'; font-weight: 900; src: url('../../../fonts/Inter-Black.otf'); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url('../../../fonts/Inter-ExtraBold.otf'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('../../../fonts/Inter-SemiBold.otf'); }
</style>

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
const W = 1080, H = 1920, CX = 490, DUR = 53;
window.SCENE = { duration: DUR, fps: 30, width: W, height: H };
const ctx = document.getElementById('c').getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k;
const win = (t, a, b) => clamp((t - a) / (b - a));
const E = { out: k => 1 - Math.pow(1 - k, 3), io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  back: k => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); } };
const C = { red: '#ff3b47', yel: '#ffcc33', white: '#fff', soft: '#9aa3c7', ui: '#151a2e', ui2: '#1f2640', green: '#2fd27a', ink: '#05060d' };
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function txt(s, x, y, size, col = C.white, { weight = 800, align = 'left', alpha = 1 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `${weight} ${size}px Inter`; ctx.textBaseline = 'middle'; ctx.textAlign = align; ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore(); }

// ───── свой рисунок (плоский вектор, как в референсах) ─────
const OL = '#151225', SKIN = '#f0b48a', SKIN2 = '#d98f62', HAIR = '#16131f', JEANS = '#3b5b9a', HOOD = '#3a3f4f', YEL = '#e8b021', YEL2 = '#b9860f';
const seeded = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function glow(x, y, r, col, a = 1) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore(); }
function fillOL(col, lw = 5) { ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = OL; ctx.lineJoin = 'round'; ctx.stroke(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
// голова: o = { face: 'dauren'|'marat', look, eyes (0..1.6), brows: 'worried'|'calm', mouth: 'flat'|'o'|'smile'|'tense', hood (0..1), jacket, shadow (0..1) }
function head(x, y, r, o = {}) { const lk = o.look || 0, jk = o.jacket || HOOD, hood = o.hood || 0;
  ctx.save(); ctx.translate(x, y); const lw = Math.max(4, r * .06);
  if (hood > 0) { ctx.save(); ctx.translate(0, (1 - hood) * r * .9); circle(0, -r * .08, r * 1.2); fillOL(jk, lw); ctx.restore(); }
  circle(lk * r * .08, 0, r); fillOL(SKIN, lw);
  circle(-r * .98 + lk * r * .25, r * .08, r * .2); fillOL(SKIN, lw * .8); // ухо
  if (o.face === 'marat') { ctx.save(); ctx.beginPath(); ctx.arc(lk * r * .08, 0, r - lw / 2, 0, Math.PI * 2); ctx.clip(); ctx.fillStyle = 'rgba(70,60,90,.28)'; ctx.beginPath(); ctx.ellipse(lk * r * .1, r * .62, r * .78, r * .5, 0, 0, Math.PI * 2); ctx.fill();
    const rnd = seeded(3); ctx.fillStyle = 'rgba(40,35,55,.35)'; for (let i = 0; i < 160; i++) { const a = Math.PI * (.2 + rnd() * .6), rr2 = r * (.6 + rnd() * .38); circle(Math.cos(a) * rr2 + lk * r * .1, Math.sin(a) * rr2 + r * .1, r * .011); ctx.fill(); } ctx.restore(); }
  if (hood < .6) { ctx.save(); ctx.beginPath(); ctx.arc(lk * r * .08, 0, r, Math.PI * 1.03, Math.PI * 1.97); // волосы
    ctx.quadraticCurveTo(r * .5 + lk * r * .2, -r * .55, lk * r * .1, -r * .5); ctx.quadraticCurveTo(-r * .5, -r * .62, -r * .99, -r * .1); ctx.closePath(); ctx.globalAlpha = 1 - hood / .6; fillOL(HAIR, lw); ctx.restore(); }
  if (hood > 0) { ctx.save(); ctx.translate(0, (1 - hood) * r * .9); ctx.beginPath(); ctx.arc(0, -r * .08, r * 1.2, Math.PI * 1.05, Math.PI * 1.95); ctx.arc(0, r * .2, r * .98, Math.PI * 1.9, Math.PI * 1.1, true); ctx.closePath(); fillOL(jk, lw); ctx.restore(); }

    ctx.fillStyle = '#fff'; circle(r * .03, -r * .04 * es, r * .03); ctx.fill(); ctx.restore();
    ctx.save(); ctx.strokeStyle = OL; ctx.lineWidth = lw * 1.1; ctx.lineCap = 'round'; ctx.beginPath(); const by = ey - r * .26 * Math.max(es, .8), tilt = o.brows === 'worried' ? r * .09 : o.brows === 'angry' ? -r * .07 : 0;
    const tl = o.brows === 'worried' ? r * .1 : o.brows === 'angry' ? -r * .08 : 0; ctx.moveTo(ox + s * (ex - r * .16), by - tl); ctx.lineTo(ox + s * (ex + r * .14), by + tl * .3); ctx.stroke(); ctx.restore();

  ctx.save(); ctx.strokeStyle = OL; ctx.lineWidth = lw * 1.1; ctx.lineCap = 'round'; ctx.beginPath(); const my = r * .45, mx = ox * .8;
  if (o.mouth === 'o') { ctx.fillStyle = '#5a2430'; ctx.ellipse(mx, my, r * .07, r * .1, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }

  else if (o.mouth === 'tense') { ctx.moveTo(mx - r * .14, my + r * .02); ctx.quadraticCurveTo(mx, my - r * .05, mx + r * .14, my + r * .02); ctx.stroke(); }
  else { ctx.moveTo(mx - r * .1, my); ctx.lineTo(mx + r * .1, my); ctx.stroke(); }

  if (o.shadow) { ctx.save(); ctx.beginPath(); ctx.arc(lk * r * .08, 0, r + lw, 0, Math.PI * 2); ctx.clip(); ctx.fillStyle = `rgba(8,8,18,${o.shadow * .9})`; ctx.fillRect(-r * 1.3, -r * 1.3, r * 2.6, r * 2.6);
    if (o.shadow > .5) for (const s of [-1, 1]) { ctx.fillStyle = `rgba(255,255,255,${(o.shadow - .5) * 1.6})`; circle(ox + s * ex, ey, r * .045); ctx.fill(); } ctx.restore(); }
  ctx.restore(); }
// человек целиком: ноги в (x, y), рост ≈ 420·s
function person(x, y, s, o = {}) { const jk = o.jacket || HOOD, ph = o.walk ?? null, sw = ph === null ? 0 : Math.sin(ph) * .45, lw = 5;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (o.flip ? -1 : 1), s); const bob = ph === null ? 0 : Math.abs(Math.cos(ph)) * -6; ctx.translate(0, bob);

  for (const [k, side] of [[-sw * .8, -1], [sw * .8, 1]]) { ctx.save(); ctx.translate(side * 52, -250); ctx.rotate(k + side * .12 + (o.armUp && side > 0 ? -1.2 : 0)); rr(-17, 0, 34, 122, 16); fillOL(jk, lw); circle(0, 128, 15); fillOL(SKIN, lw);
    if (jk === YEL) { ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(-15, 70, 30, 7); } ctx.restore(); }
  rr(-64, -272, 128, 168, 40); fillOL(jk, lw); ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, -262); ctx.lineTo(0, -112); ctx.stroke();
  if (jk === YEL) { ctx.strokeStyle = YEL2; ctx.lineWidth = 3; for (const yy of [-225, -185, -145]) { ctx.beginPath(); ctx.moveTo(-60, yy); ctx.quadraticCurveTo(0, yy + 8, 60, yy); ctx.stroke(); } }
  head(0, -342, 74, o); ctx.restore(); }
// машина-такси сбоку (своя, без марки)
function taxiCar(x, y, s, lights = 1) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (lights) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createLinearGradient(-200, 0, -900, 0); g.addColorStop(0, `rgba(255,236,170,${.45 * lights})`); g.addColorStop(1, 'rgba(255,236,170,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-200, -70); ctx.lineTo(-900, -200); ctx.lineTo(-900, 60); ctx.lineTo(-200, -30); ctx.fill(); ctx.restore(); }
  ctx.beginPath(); ctx.moveTo(-210, -30); ctx.lineTo(-200, -95); ctx.lineTo(-120, -110); ctx.lineTo(-60, -170); ctx.lineTo(110, -170); ctx.lineTo(170, -110); ctx.lineTo(220, -100); ctx.lineTo(225, -30); ctx.closePath(); fillOL('#c9cedb', 5);
  ctx.beginPath(); ctx.moveTo(-100, -112); ctx.lineTo(-52, -158); ctx.lineTo(20, -158); ctx.lineTo(20, -112); ctx.closePath(); fillOL('#1e2540', 4);
  ctx.beginPath(); ctx.moveTo(32, -112); ctx.lineTo(32, -158); ctx.lineTo(104, -158); ctx.lineTo(150, -112); ctx.closePath(); fillOL('#1e2540', 4);
  rr(-20, -198, 70, 28, 8); fillOL(C.yel, 4);
  for (const wx of [-125, 140]) { circle(wx, -28, 38); fillOL('#1b1b24', 5); circle(wx, -28, 16); fillOL('#8a8fa3', 3); }
  ctx.fillStyle = '#fff4c8'; rr(-212, -88, 22, 18, 6); ctx.fill(); ctx.fillStyle = C.red; rr(208, -92, 14, 18, 5); ctx.fill(); ctx.restore(); }
function bokeh(t, seed, n, y0, y1, a = .5) { const r = seeded(seed); ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) { const x = r() * W, y = y0 + r() * (y1 - y0), rad = 14 + r() * 40, c = r() < .5 ? '255,190,90' : r() < .5 ? '120,160,255' : '255,90,90', fl = .6 + .4 * Math.sin(t * (1 + r()) + i);
    ctx.fillStyle = `rgba(${c},${a * .35 * fl})`; circle((x + t * 12 * (r() - .5)) % W, y, rad); ctx.fill(); } ctx.restore(); }
function vignette(k = .65) { const g = ctx.createRadialGradient(540, 900, 380, 540, 960, 1200); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${k})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
const DROPS = (() => { const r = seeded(7); return Array.from({ length: 90 }, () => [r() * W, r() * H, 2 + r() * 5, .3 + r() * .7]); })();
function rain(t, a = .5) { ctx.save(); ctx.globalAlpha = a;
  for (const [x, y0, r, sp] of DROPS) { const y = (y0 + t * 140 * sp) % (H + 60) - 30; ctx.fillStyle = 'rgba(190,210,255,.35)'; ctx.beginPath(); ctx.ellipse(x, y, r * .7, r * 1.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(190,210,255,.12)'; ctx.lineWidth = r * .6; ctx.beginPath(); ctx.moveTo(x, y - r * 8 * sp); ctx.lineTo(x, y); ctx.stroke(); } ctx.restore(); }
function streaks(t, a = .35) { const r = seeded(11); ctx.save(); ctx.strokeStyle = `rgba(170,190,235,${a})`; ctx.lineWidth = 2;
  for (let i = 0; i < 120; i++) { const x = r() * (W + 200), sp = 900 + r() * 600, y = ((r() * H + t * sp) % (H + 100)) - 50; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 10, y + 34); ctx.stroke(); } ctx.restore(); }
const cam = (z, fx, fy, draw) => { ctx.save(); ctx.translate(fx, fy); ctx.scale(z, z); ctx.translate(-fx, -fy); draw(); ctx.restore(); };

// ───── сцены ─────
function carDark(t) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0a0f22'); g.addColorStop(1, '#05060d'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.beginPath(); ctx.moveTo(-40, 160); ctx.lineTo(1120, 160); ctx.lineTo(1120, 1050); ctx.lineTo(-40, 1050); ctx.closePath(); ctx.clip(); // лобовое стекло
  const gg = ctx.createLinearGradient(0, 160, 0, 1050); gg.addColorStop(0, '#101a3a'); gg.addColorStop(1, '#1a1430'); ctx.fillStyle = gg; ctx.fillRect(0, 0, W, H); bokeh(t, 5, 26, 500, 1000, .9); rain(t, .6); ctx.restore();
  ctx.fillStyle = '#07080f'; ctx.beginPath(); ctx.moveTo(-40, 1000); ctx.quadraticCurveTo(540, 900, 1120, 1000); ctx.lineTo(1120, H); ctx.lineTo(-40, H); ctx.fill(); // торпеда
  ctx.fillStyle = '#04050a'; ctx.fillRect(0, 0, W, 170); }
function hand(back) { // рука держит телефон снизу (как в референсе)
  if (back) { ctx.fillStyle = '#2b2f3d'; ctx.beginPath(); ctx.moveTo(CX - 150, H); ctx.lineTo(CX - 110, PH.y + PH.h + 120); ctx.lineTo(CX + 130, PH.y + PH.h + 120); ctx.lineTo(CX + 190, H); ctx.fill();
    ctx.beginPath(); ctx.ellipse(CX, PH.y + PH.h - 40, 250, 190, 0, 0, Math.PI * 2); fillOL(SKIN, 6); rr(PH.x - 42, PH.y + PH.h - 330, 70, 260, 34); fillOL(SKIN, 6); return; }
  for (let i = 0; i < 4; i++) { rr(PH.x + PH.w - 18, PH.y + 330 + i * 120, 74, 92, 34); fillOL(SKIN, 6); } }
function room(t) { // утро, спальня: постель, шкаф с антресолью
  let g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2c3658'); g.addColorStop(.7, '#222a47'); g.addColorStop(1, '#161b30'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#1b2139'; ctx.fillRect(0, 1240, W, H); // пол
  rr(90, 330, 330, 470, 10); fillOL('#a9bde3', 6); ctx.strokeStyle = OL; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(255, 330); ctx.lineTo(255, 800); ctx.moveTo(90, 560); ctx.lineTo(420, 560); ctx.stroke();
  ctx.fillStyle = '#5d6b9c'; ctx.beginPath(); ctx.moveTo(70, 310); ctx.quadraticCurveTo(140, 560, 100, 830); ctx.lineTo(60, 830); ctx.lineTo(50, 310); ctx.fill(); ctx.beginPath(); ctx.moveTo(440, 310); ctx.quadraticCurveTo(380, 560, 420, 830); ctx.lineTo(460, 830); ctx.lineTo(470, 310); ctx.fill();
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(150,180,240,.10)'; ctx.beginPath(); ctx.moveTo(90, 800); ctx.lineTo(420, 800); ctx.lineTo(760, 1400); ctx.lineTo(160, 1400); ctx.fill(); ctx.restore();
  rr(720, 380, 300, 880, 10); fillOL('#4a3a3a', 6); rr(720, 380, 300, 170, 10); fillOL('#55433f', 6); // шкаф, антресоль
  ctx.fillStyle = '#05050a'; ctx.fillRect(870, 392, 140, 146); rr(870, 392, 26, 146, 3); fillOL('#55433f', 4); ctx.save(); ctx.translate(880, 392); ctx.transform(1, 0.04, -0.25, 1, 0, 0); rr(-150, 0, 150, 146, 6); fillOL('#5f4c47', 5); ctx.restore(); // приоткрытая дверца
  ctx.strokeStyle = OL; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(870, 560); ctx.lineTo(870, 1260); ctx.stroke(); circle(850, 900, 8); ctx.fillStyle = '#c9a36a'; ctx.fill(); circle(890, 900, 8); ctx.fill();
  rr(140, 1020, 640, 260, 20); fillOL('#3b2c2c', 6); rr(150, 960, 620, 120, 30); fillOL('#d8dbe8', 6); // кровать
  ctx.beginPath(); ctx.moveTo(300, 975); ctx.quadraticCurveTo(420, 930, 520, 990); ctx.quadraticCurveTo(640, 950, 780, 990); ctx.lineTo(790, 1150); ctx.quadraticCurveTo(500, 1190, 280, 1140); ctx.closePath(); fillOL('#7f8db3', 6);
  ctx.strokeStyle = 'rgba(21,18,37,.5)'; ctx.lineWidth = 5; for (const [a1, b1, c1, d1] of [[360, 1010, 450, 1120], [560, 1000, 520, 1110], [680, 1010, 720, 1130]]) { ctx.beginPath(); ctx.moveTo(a1, b1); ctx.quadraticCurveTo((a1 + c1) / 2 + 30, (b1 + d1) / 2, c1, d1); ctx.stroke(); }
  ctx.beginPath(); ctx.ellipse(215, 990, 85, 46, -.1, 0, Math.PI * 2); fillOL('#eef0f7', 6); ctx.fillStyle = 'rgba(120,130,170,.45)'; ctx.beginPath(); ctx.ellipse(220, 995, 40, 18, -.1, 0, Math.PI * 2); ctx.fill(); // подушка с вмятиной
  const hot = .5 + .5 * Math.sin(t * 3); glow(470, 1040, 160, `rgba(255,120,80,${.18 + .08 * hot})`); // «тёплая»
}
function kitchen(t) { ctx.fillStyle = '#121830'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#0c1022'; ctx.fillRect(0, 1250, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(200,225,255,.16)'; ctx.beginPath(); ctx.moveTo(470, 1250); ctx.lineTo(800, 1250); ctx.lineTo(1080, 1700); ctx.lineTo(200, 1700); ctx.fill(); ctx.restore();
  rr(470, 380, 330, 870, 26); fillOL('#d6dcea', 6); rr(492, 400, 286, 830, 16); fillOL('#eef4ff', 5); glow(635, 800, 520, 'rgba(210,230,255,.35)');
  ctx.strokeStyle = '#aab6cf'; ctx.lineWidth = 6; for (const yy of [610, 820, 1030]) { ctx.beginPath(); ctx.moveTo(498, yy); ctx.lineTo(772, yy); ctx.stroke(); }
  ctx.beginPath(); ctx.ellipse(580, 588, 22, 28, 0, 0, Math.PI * 2); fillOL('#fffaf0', 4); // яйцо
  ctx.beginPath(); ctx.moveTo(620, 818); ctx.lineTo(620, 770); ctx.quadraticCurveTo(660, 740, 700, 770); ctx.lineTo(700, 818); ctx.closePath(); fillOL('#c98a4a', 4); // хлеб
  ctx.save(); ctx.translate(600, 1028); ctx.rotate(-1.3); rr(0, -40, 110, 50, 6); fillOL('#ffffff', 4); ctx.restore(); // пустой пакет
  ctx.save(); ctx.translate(470, 380); ctx.transform(1, -0.08, 0, 1, 0, 0); rr(-230, 0, 230, 870, 20); fillOL('#c4cbdd', 6); rr(-200, 40, 170, 130, 10); fillOL('#e3e8f3', 4); ctx.restore(); // дверца
  person(250, 1310, 1.25, { face: 'dauren', look: .9, brows: 'worried', mouth: 'tense', eyes: 1.1 });
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(200,225,255,.12)'; ctx.fillRect(160, 700, 180, 620); ctx.restore(); }
function hallway(t) { ctx.fillStyle = '#242b48'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#1a2036'; ctx.fillRect(0, 1260, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,220,150,.12)'; ctx.beginPath(); ctx.moveTo(430, 300); ctx.lineTo(550, 300); ctx.lineTo(680, 1260); ctx.lineTo(300, 1260); ctx.fill(); ctx.restore();
  rr(120, 560, 760, 30, 8); fillOL('#5a4436', 5);

  ctx.fillStyle = '#7fae6a'; ctx.fillRect(-100, 50, 200, 40); ctx.save(); ctx.beginPath(); ctx.rect(-100, -90, 200, 180); ctx.clip(); taxiCar(40, 84, .3, 0); person(-45, 86, .33, { face: 'dauren', jacket: YEL, mouth: 'smile', armUp: true }); ctx.restore(); ctx.restore(); }
function building(t, litK = 1) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#070a18'); g.addColorStop(1, '#111733'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

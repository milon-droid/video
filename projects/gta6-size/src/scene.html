<!-- Новость: размер GTA 6 и даты. 1080×1920, 30 fps, 39 с. Факты — research.md. Без логотипов/персонажей правообладателей. -->

<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
const W = 1080, H = 1920, CX = 500, DUR = 39;
window.SCENE = { duration: DUR, fps: 30, width: W, height: H };
const ctx = document.getElementById('c').getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k;
const win = (t, a, b) => clamp((t - a) / (b - a)), pulse = (t, a, b) => Math.sin(win(t, a, b) * Math.PI);
const E = { out: k => 1 - Math.pow(1 - k, 3), in: k => k * k * k, io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  back: k => { const c1 = 2.0, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); } };
const pop = (t, t0, d = .35) => E.back(win(t, t0, t0 + d));
const C = { pink: '#ff3fa4', orange: '#ff9a3c', yel: '#ffd23f', cyan: '#3fe0ff', green: '#35e08a', red: '#ff3b47', white: '#fff', ink: '#160b33', panel: '#2a1758', soft: '#b9a6ec' };
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function line(spans, x, y, size, { weight = 900, align = 'center', alpha = 1, sc = 1, stroke = true } = {}) {
  if (typeof spans === 'string') spans = [[spans, C.white]];
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(sc, sc); ctx.font = `${weight} ${size}px Inter`; ctx.textBaseline = 'middle';
  const total = spans.reduce((a, [s]) => a + ctx.measureText(s).width, 0); let cx = align === 'center' ? -total / 2 : align === 'right' ? -total : 0;
  for (const [s, col] of spans) { if (stroke) { ctx.lineWidth = size * .16; ctx.strokeStyle = 'rgba(10,4,30,.9)'; ctx.lineJoin = 'round'; ctx.strokeText(s, cx, 0); } ctx.fillStyle = col; ctx.fillText(s, cx, 0); cx += ctx.measureText(s).width; }
  ctx.restore(); }
const enter = (t, t0, dx = 0, dy = 80) => { const k = E.out(win(t, t0, t0 + .35)); return { a: k, dx: dx * (1 - k), dy: dy * (1 - k) }; };

// ───── фон: неоновый закат, сетка, пальмы (своё) ─────
function background(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1a0b3d'); g.addColorStop(.55, '#3a1260'); g.addColorStop(.72, '#7a1f6e'); g.addColorStop(1, '#14072c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const sun = ctx.createLinearGradient(0, 1150, 0, 1500); sun.addColorStop(0, '#ffd23f'); sun.addColorStop(1, '#ff3fa4');
  ctx.save(); ctx.globalAlpha = .35; ctx.fillStyle = sun; ctx.beginPath(); ctx.arc(540, 1420, 300, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#3a1260'; for (let i = 0; i < 6; i++) ctx.fillRect(200, 1300 + i * 22, 680, 6 + i * 2); ctx.restore();
  ctx.save(); ctx.strokeStyle = 'rgba(255,63,164,.28)'; ctx.lineWidth = 2; const hz = 1420;
  for (let i = 0; i < 12; i++) { const y = hz + Math.pow((i + (t * .8) % 1) / 12, 2) * 520; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (let i = -10; i <= 10; i++) { ctx.beginPath(); ctx.moveTo(540 + i * 30, hz); ctx.lineTo(540 + i * 160, H); ctx.stroke(); } ctx.restore();
  const palm = (x, s, f) => { ctx.save(); ctx.translate(x, 1430); ctx.scale(s * f, s); ctx.fillStyle = '#0e0520';
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.quadraticCurveTo(20, -200, 60, -380); ctx.lineTo(74, -378); ctx.quadraticCurveTo(36, -200, 14, 0); ctx.fill();
    for (let i = 0; i < 6; i++) { ctx.save(); ctx.translate(66, -380); ctx.rotate(-2.6 + i * .95 + Math.sin(t + i) * .04); ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(70, -30, 150, 20); ctx.quadraticCurveTo(70, -6, 0, 10); ctx.fill(); ctx.restore(); } ctx.restore(); };
  palm(60, 1.1, 1); palm(1010, 1.0, -1);
}
function vignette() { const g = ctx.createRadialGradient(540, 960, 650, 540, 960, 1250); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.5)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }

// ───── рисунки ─────
function gameBlock(x, y, w, h, title, sub, c1, c2) { ctx.save(); ctx.translate(x, y);
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.shadowColor = c1; ctx.shadowBlur = 30; ctx.fillStyle = g; rr(-w / 2, -h / 2, w, h, 22); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 4; rr(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, 16); ctx.stroke();
  line([[title, '#fff']], 0, -h * .12, Math.min(64, w * .22)); line([[sub, '#fff']], 0, h * .22, Math.min(46, w * .15), { weight: 800 }); ctx.restore(); }
function scales(t, x, y, tilt) { // весы: левая чаша — GTA 6, правая — две GTA 5
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#d8c9ff'; ctx.beginPath(); ctx.moveTo(-90, 520); ctx.lineTo(90, 520); ctx.lineTo(20, 40); ctx.lineTo(-20, 40); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.rotate(tilt); ctx.fillStyle = '#efe6ff'; rr(-350, -14, 700, 28, 14); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
  const pan = (side) => { const px = Math.cos(tilt) * 320 * side, py = Math.sin(tilt) * 320 * side;
    ctx.save(); ctx.translate(px, py); ctx.strokeStyle = '#efe6ff'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-120, 200); ctx.moveTo(0, 0); ctx.lineTo(120, 200); ctx.stroke();
    ctx.fillStyle = '#efe6ff'; ctx.beginPath(); ctx.ellipse(0, 205, 150, 22, 0, 0, Math.PI * 2); ctx.fill();
    if (side < 0) gameBlock(0, 110, 240, 170, 'GTA 6', '212 ГБ', C.pink, '#b0136a');
    else { for (const [dx, dy] of [[-62, 150], [62, 150], [-62, 62], [62, 62]]) gameBlock(dx, dy, 118, 84, 'GTA 5', '50 ГБ', '#4a7dff', '#2547b8'); }
    ctx.restore(); };
  pan(-1); pan(1); ctx.restore(); }
// размеры на старте продаж (research.md)
const GAMES = [['GTA 6 · 2026', 212, C.pink], ['Red Dead Redemption 2 · 2018', 105, '#e0682b'], ['Cyberpunk 2077 · 2020', 70, '#f2e600'], ['Elden Ring · 2022', 60, '#c9a86a'], ['GTA 5 · PS4, 2014', 50, '#4a7dff'], ['Red Dead Redemption · 2010', 9, C.green]];
function bars(t, t0) {
  GAMES.forEach(([name, gb, col], i) => { const k = E.out(win(t, t0 + i * .28, t0 + i * .28 + .5)); if (k <= 0) return;
    const y = 620 + i * 150, w = 620 * gb / 212 * k;
    line([[name, '#fff']], 120, y - 42, 34, { weight: 800, align: 'left', alpha: k });
    ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = 'rgba(255,255,255,.08)'; rr(120, y - 14, 620, 52, 26); ctx.fill();
    ctx.shadowColor = col; ctx.shadowBlur = 20; ctx.fillStyle = col; rr(120, y - 14, Math.max(w, 26), 52, 26); ctx.fill(); ctx.restore();
    line([[gb < 10 ? `≈${gb} ГБ` : `${gb} ГБ`, '#fff']], 120 + Math.max(w, 26) + 16, y + 12, 36, { align: 'left', alpha: k }); });
}
function storage(x, y, k, t) { ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#0f0826'; rr(-360, -70, 720, 140, 30); ctx.fill(); ctx.strokeStyle = '#d8c9ff'; ctx.lineWidth = 6; ctx.stroke();
  ctx.fillStyle = C.pink; ctx.shadowColor = C.pink; ctx.shadowBlur = 24; rr(-348, -58, 696 * .58 * k, 116, 22); ctx.fill(); ctx.shadowBlur = 0;
  line([[`GTA 6 · ${Math.round(58 * k)}%`, '#fff']], -330, 0, 44, { align: 'left' }); ctx.restore(); }
function consoleBox(x, y) { ctx.save(); ctx.translate(x, y); // своя «консоль»: прямоугольный корпус
  ctx.fillStyle = '#f1edff'; rr(-170, -110, 340, 220, 26); ctx.fill(); ctx.fillStyle = '#1a1033'; ctx.beginPath(); ctx.arc(70, -10, 52, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3fe0ff'; ctx.beginPath(); ctx.arc(70, -10, 12, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#c9c0e8'; rr(-140, 60, 120, 14, 7); ctx.fill(); ctx.restore(); }
function dateCard(x, y, day, mon, l1, l2, col, k) { const s = lerp(.6, 1, E.back(k)); ctx.save(); ctx.globalAlpha *= clamp(k * 1.5); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = C.panel; rr(-380, -120, 760, 240, 30); ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.stroke();
  ctx.fillStyle = '#fff'; rr(-350, -95, 190, 190, 20); ctx.fill(); ctx.fillStyle = col; rr(-350, -95, 190, 56, 20); ctx.fill(); ctx.fillRect(-350, -60, 190, 20);
  line([[mon, '#fff']], -255, -68, 32, { stroke: false }); line([[day, C.ink]], -255, 30, 96, { stroke: false });
  line([[l1, '#fff']], -130, -30, 46, { align: 'left', stroke: false }); line([[l2, C.yel]], -130, 30, 34, { weight: 800, align: 'left', stroke: false }); ctx.restore(); }
function gauge(x, y, k) { ctx.save(); ctx.translate(x, y);
  ctx.lineWidth = 36; ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(0, 0, 230, Math.PI, 0); ctx.stroke();
  const g = ctx.createLinearGradient(-230, 0, 230, 0); g.addColorStop(0, C.red); g.addColorStop(.5, C.yel); g.addColorStop(1, C.green);
  ctx.strokeStyle = g; ctx.beginPath(); ctx.arc(0, 0, 230, Math.PI, Math.PI + Math.PI * .45 * k); ctx.stroke();
  const a = Math.PI + Math.PI * .45 * k; ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 190, Math.sin(a) * 190); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
  line([[`${Math.round(88 * k)}`, '#fff']], 0, 80, 110); line([['Мбит/с', C.soft]], 0, 150, 38, { weight: 800 }); ctx.restore(); }
function progress(x, y, p, label, eta, col) { ctx.save(); ctx.translate(x, y);
  line([[label, '#fff']], -360, -70, 36, { weight: 800, align: 'left' });
  ctx.fillStyle = 'rgba(255,255,255,.1)'; rr(-360, -26, 720, 52, 26); ctx.fill(); ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 20; rr(-360, -26, Math.max(26, 720 * p), 52, 26); ctx.fill(); ctx.shadowBlur = 0;
  line([[`${(p * 100).toFixed(p < .1 ? 1 : 0)}%`, '#fff']], -360, 70, 36, { align: 'left' }); line([[eta, C.yel]], 360, 70, 36, { align: 'right' }); ctx.restore(); }
function monitor(x, y, k, t) { ctx.save(); ctx.translate(x, y); ctx.globalAlpha *= clamp(k * 1.4); const s = lerp(.7, 1, E.back(k)); ctx.scale(s, s);
  ctx.fillStyle = '#e8e1ff'; rr(-230, -150, 460, 290, 20); ctx.fill(); ctx.fillStyle = '#1a1033'; rr(-210, -130, 420, 250, 12); ctx.fill();
  ctx.fillStyle = '#cfc4f5'; ctx.fillRect(-30, 140, 60, 50); rr(-110, 186, 220, 22, 10); ctx.fill();
  line([['2027', C.cyan]], 0, -10, 110, { stroke: false });
  ctx.strokeStyle = C.yel; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(150, -110, 30, Math.PI, 0); ctx.stroke(); ctx.fillStyle = C.yel; rr(108, -112, 84, 68, 12); ctx.fill(); ctx.restore(); }
function consoles(x, y, k) { ctx.save(); ctx.translate(x, y); ctx.globalAlpha *= clamp(k * 1.4);
  for (const [dx, col, lab] of [[-150, '#f1edff', 'PS5'], [150, '#2a2a33', 'Xbox']]) { ctx.save(); ctx.translate(dx, 0); ctx.fillStyle = col; rr(-70, -150, 140, 300, 30); ctx.fill();
    ctx.fillStyle = col === '#2a2a33' ? '#55e07a' : '#4a7dff'; ctx.beginPath(); ctx.arc(0, -80, 16, 0, Math.PI * 2); ctx.fill(); line([[lab, col === '#2a2a33' ? '#fff' : C.ink]], 0, 100, 34, { stroke: false }); ctx.restore(); }
  ctx.restore(); }
function bullet(x, y, k, l1, l2, col) { const s = lerp(.6, 1, E.back(k)); ctx.save(); ctx.globalAlpha *= clamp(k * 1.5); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = C.panel; rr(-380, -95, 760, 190, 28); ctx.fill(); ctx.fillStyle = col; rr(-380, -95, 18, 190, 9); ctx.fill();
  line([[l1, '#fff']], -330, -26, 42, { align: 'left', stroke: false }); line([[l2, C.soft]], -330, 30, 34, { weight: 800, align: 'left', stroke: false }); ctx.restore(); }
function trash(x, y, t, hits) { ctx.save(); ctx.translate(x, y); const lid = Math.max(0, ...hits.map(h => pulse(t, h - .1, h + .2)));
  ctx.fillStyle = '#cfc4f5'; ctx.beginPath(); ctx.moveTo(-150, -120); ctx.lineTo(150, -120); ctx.lineTo(120, 200); ctx.lineTo(-120, 200); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#9d8fd6'; ctx.lineWidth = 10; for (const dx of [-60, 0, 60]) { ctx.beginPath(); ctx.moveTo(dx, -80); ctx.lineTo(dx * .85, 170); ctx.stroke(); }
  ctx.save(); ctx.translate(-160, -130); ctx.rotate(-lid * .6); ctx.fillStyle = '#e8e1ff'; rr(0, -26, 320, 32, 14); ctx.fill(); rr(130, -54, 60, 30, 10); ctx.fill(); ctx.restore(); ctx.restore(); }

function badge(x, y, k, s, col) { if (k <= 0) return; const sc = lerp(.4, 1, E.back(k)); ctx.save(); ctx.globalAlpha *= clamp(k * 2); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.font = '900 40px Inter'; const w = ctx.measureText(s).width + 44; ctx.shadowColor = col; ctx.shadowBlur = 24; ctx.fillStyle = col; rr(-w / 2, -32, w, 64, 32); ctx.fill(); ctx.shadowBlur = 0;
  line([[s, C.ink]], 0, 2, 40, { stroke: false }); ctx.restore(); }
function clockCard(x, y, k, from, to, flip, sub, col) { if (k <= 0) return; const sc = lerp(.6, 1, E.back(k)); ctx.save(); ctx.globalAlpha *= clamp(k * 1.5); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.fillStyle = '#0f0826'; rr(-190, -80, 380, 160, 26); ctx.fill(); ctx.strokeStyle = flip ? col : 'rgba(255,255,255,.25)'; ctx.lineWidth = 5; ctx.stroke();
  if (flip) { ctx.shadowColor = col; ctx.shadowBlur = 30; } line([[flip ? to : from, flip ? col : '#fff']], 0, -12, 88, { stroke: false }); ctx.shadowBlur = 0;
  line([[sub, C.soft]], 0, 52, 28, { weight: 800, stroke: false }); ctx.restore(); }
function speedChart(x, y, t, t0, reveal) { // «стабильный» график: ровная линия… у самого дна
  ctx.save(); ctx.translate(x, y); const w = 720, h = 380;
  ctx.fillStyle = 'rgba(15,8,38,.92)'; rr(-w / 2, -h / 2, w, h, 28); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 4; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 2; for (let i = 1; i < 4; i++) { const yy = -h / 2 + 40 + i * (h - 80) / 4; ctx.beginPath(); ctx.moveTo(-w / 2 + 110, yy); ctx.lineTo(w / 2 - 30, yy); ctx.stroke(); }
  const x0 = -w / 2 + 110, x1 = w / 2 - 30, yTop = -h / 2 + 40, yBot = h / 2 - 50, yLine = lerp(-10, yBot - 26, E.io(reveal));
  line([['100 Мбит/с', C.soft]], x0 - 14, yTop, 22, { weight: 800, align: 'right', stroke: false, alpha: reveal });
  line([['0', C.soft]], x0 - 14, yBot, 22, { weight: 800, align: 'right', stroke: false, alpha: reveal });
  line([['скорость', C.soft]], x0 - 14, (yTop + yBot) / 2, 22, { weight: 800, align: 'right', stroke: false, alpha: 1 - reveal });
  const k = E.out(win(t, t0, t0 + .9)), col = reveal > .5 ? C.red : C.green;
  ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 18; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x0, yLine); ctx.lineTo(lerp(x0, x1, k), yLine + Math.sin(t * 30) * .6); ctx.stroke(); ctx.shadowBlur = 0;
  if (k > .95) line([[reveal > .5 ? '' : 'стабильно ✓', C.green]], x1 - 10, yLine - 44, 34, { weight: 900, align: 'right', stroke: false, alpha: 1 - reveal });
  ctx.restore(); }
function stamp(x, y, k, s, col, rot = -.12, fs = 66) { if (k <= 0) return; const sc = lerp(2.2, 1, E.out(k)); ctx.save(); ctx.globalAlpha *= clamp(k * 2); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.font = `900 ${fs}px Inter`; const w = ctx.measureText(s).width + fs * .9, hh = fs * 1.64; ctx.strokeStyle = col; ctx.lineWidth = fs * .13; rr(-w / 2, -hh / 2, w, hh, 16); ctx.stroke();
  line([[s, col]], 0, fs * .06, fs, { stroke: false }); ctx.restore(); }

// ───── планы ─────
const SHOTS = [
  [0, 4.2, t => { // 1. хук: GTA 6 тяжелее четырёх GTA 5 (озвучка v01)
    const tilt = -0.2 * E.back(win(t, .7, 1.2)) + .04 * Math.sin(t * 6) * Math.exp(-(t - 1.2) * 3) * (t > 1.2 ? 1 : 0);
    const e = enter(t, 0, 0, 160), z = lerp(1, 1.07, E.io(win(t, 1.2, 4.2)));
    ctx.save(); ctx.globalAlpha = e.a; ctx.translate(CX, 900 + e.dy); ctx.scale(z, z); ctx.translate(-CX, -900); scales(t, CX, 900, tilt); ctx.restore();
    line([['GTA 6', C.pink], [' весит больше,', C.white]], CX, 300, 70, { sc: pop(t, .05) });
    line([['чем ', C.white], ['ЧЕТЫРЕ GTA 5', C.cyan]], CX, 390, 80, { sc: pop(t, .25) });
    line([['(GTA 5 на PS4 в 2014 — 50 ГБ)', C.soft]], CX, 470, 34, { weight: 800, alpha: win(t, 1.0, 1.3) });
    if (t > 2.4) line([['212 ГБ', C.pink], [' > ', C.white], ['4 × 50 ГБ', C.cyan]], CX, 1500, 64, { sc: pop(t, 2.4) });
  }],
  [4.2, 8.0, t => { // 2. размеры на старте продаж (v02)
    line([['212 ГБ — это…', C.white]], CX, 290, 72, { sc: pop(t, 4.25) });
    line([['размеры игр на старте продаж', C.soft]], CX, 365, 34, { weight: 800, alpha: win(t, 4.4, 4.7) });
    bars(t, 4.35);
    const by = i => 620 + i * 150 + 12;
    badge(860, by(1), win(t, 5.3, 5.65), '×2', '#ff9a5c'); badge(860, by(2), win(t, 6.7, 7.05), '×3', C.yel); badge(860, by(3), win(t, 7.0, 7.35), '×3,5', '#c9a86a');
    badge(860, by(4), win(t, 7.3, 7.65), '×4', '#7aa0ff'); badge(860, by(5), win(t, 7.55, 7.9), '×24', C.green);
  }],
  [8.0, 11.45, t => { // 3. Xbox Series S (v03)
    const e = enter(t, 8.0, 0, 120); ctx.save(); ctx.globalAlpha = e.a; ctx.translate(0, e.dy); consoleBox(CX, 800); ctx.restore();
    storage(CX, 1120, E.io(win(t, 8.6, 9.8)), t);
    line([['На Xbox Series S', C.white]], CX, 300, 58, { sc: pop(t, 8.05) });
    line([['свободно ≈ 364 ГБ', C.soft]], CX, 375, 46, { weight: 800, sc: pop(t, 8.2) });
    line([['GTA 6 займёт ', C.white], ['больше половины', C.pink]], CX, 1290, 46, { sc: pop(t, 9.8) });
  }],
  [11.45, 18.7, t => { // 4. релиз 19 ноября + ПК в 2027 (v04)
    line([['Релиз GTA 6', C.white]], CX, 300, 76, { sc: pop(t, 11.5) });
    dateCard(CX, 600, '19', 'НОЯ', 'В полночь', 'по местному времени', C.pink, win(t, 12.0, 12.4));
    { const k = E.out(win(t, 13.8, 14.2)); ctx.save(); ctx.translate(290, 1010); ctx.scale(.72, .72); consoles(0, 0, k); ctx.restore();
      line([['PS5 · Xbox Series', '#fff']], 290, 1190, 34, { weight: 800, alpha: k }); line([['19 ноября', C.green]], 290, 1250, 44, { sc: pop(t, 14.2) }); }
    if (t > 15.6) { const k = win(t, 15.7, 16.05); ctx.save(); ctx.translate(lerp(1300, 730, E.out(k)), 1010); ctx.scale(.7, .7); monitor(0, 0, k, t); ctx.restore();
      line([['ПК', '#fff']], 730, 1190, 34, { weight: 800, alpha: k }); line([['только в 2027', C.cyan]], 730, 1250, 44, { sc: pop(t, 16.6) });

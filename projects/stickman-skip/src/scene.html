<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пропущенные секунды</title>
<!--
  Стикмен «Пропущенные секунды». 1080×1920, 30 fps, 30 с.
  Всё рисуется на canvas функцией renderFrame(t) — кадр зависит только от t.
  Рендер: node tools/render.mjs projects/stickman-skip/src/scene.html --draft
-->
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1b1630; }
  canvas { display: block; }
  .fontwarm { position: absolute; left: -9999px; font: 900 40px 'Inter'; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="fontwarm">+5 SEC −5</div>
<script>
'use strict';
window.SCENE = { duration: 30, fps: 30, width: 1080, height: 1920 };

// ───────────────────────── настройки ─────────────────────────
const W = 1080, H = 1920, G = 1250, SCALE = 1.22;           // G — уровень земли (ступни)
const FINAL_GESTURE = 'finger';               // 'finger' | 'flick' — финальный жест
const PIT = [470, 700];                       // пропасть (мир, x)
const WALL_X = 3570;                          // стена в сцене 5
const RED = '#ff2a4a', RED_D = '#c4002a';
const HERO = { line: '#0b0b12', fill: '#0b0b12' };
const GHOST = { line: '#dcdbe8', glow: 'rgba(255,255,255,0.9)' };

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ───────────────────────── утилиты ─────────────────────────
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const D2R = Math.PI / 180;
const E = {
  lin: k => k,
  io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  out: k => 1 - Math.pow(1 - k, 3),
  in: k => k * k * k,
  back: k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  step: k => 0,
};
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ev = (v, t) => typeof v === 'function' ? v(t) : v;
function blend(a, b, k) {
  if (typeof a === 'number') return lerp(a, b, k);
  const o = {};
  for (const key in a) o[key] = (key in b) ? lerp(a[key], b[key], k) : a[key];
  return o;
}
// Трек ключей: [[t, value, ease?], ...]; value — число, поза или функция(t).
// Одинаковое время у двух ключей подряд = мгновенный скачок.
function track(keys) {
  return t => {
    if (t <= keys[0][0]) return ev(keys[0][1], t);
    let i = keys.length - 1;
    while (i > 0 && keys[i][0] > t) i--;
    if (i === keys.length - 1) return ev(keys[i][1], t);
    const [t0, v0] = keys[i], [t1, v1, en] = keys[i + 1];
    const k = (E[en || 'io'])(clamp((t - t0) / (t1 - t0)));
    return blend(ev(v0, t), ev(v1, t), k);
  };
}
const win = (t, a, b) => clamp((t - a) / (b - a)); // 0..1 внутри окна

// ───────────────────────── позы ─────────────────────────
// Углы в градусах. Для конечностей 0 = вниз, + = вперёд (по направлению взгляда).
// t — наклон корпуса (+ вперёд), h — наклон головы. a1/a2 — дальняя/ближняя рука
// (u — плечо, f — предплечье), l1/l2 — ноги (u — бедро, l — голень).
const BASE = { t: 0, h: 0, a1u: -8, a1f: -4, a2u: 8, a2f: 4, l1u: -6, l1l: -6, l2u: 6, l2l: 6 };
const P = {
  stand: { ...BASE },
  walk: t => { const w = t * 1.6 * 2 * Math.PI, s = Math.sin(w), c = Math.cos(w);
    const th1 = 24 * s, th2 = -th1;
    return { t: 4, h: 0, l1u: th1, l1l: th1 - 34 * Math.max(0, c), l2u: th2, l2l: th2 - 34 * Math.max(0, -c),
      a1u: -18 * s, a1f: -18 * s + 14, a2u: 18 * s, a2f: 18 * s + 14 }; },
  run: t => { const w = t * 2.6 * 2 * Math.PI, s = Math.sin(w), c = Math.cos(w);
    const th1 = 44 * s, th2 = -th1;
    return { t: 16, h: -4, l1u: th1, l1l: th1 - 85 * Math.max(0, c), l2u: th2, l2l: th2 - 85 * Math.max(0, -c),
      a1u: -42 * s, a1f: -42 * s + 80, a2u: 42 * s, a2f: 42 * s + 80 }; },
  backRun: t => { const p = P.run(t); return { ...p, t: -10, h: 8 }; },
  brake: { t: -24, h: -10, a1u: -110, a1f: -140, a2u: 120, a2f: 150, l1u: -18, l1l: -50, l2u: 36, l2l: 44 },
  windmill: t => { const w = t * 9; return { t: -14, h: -6, a1u: -100 + 70 * Math.sin(w), a1f: -100 + 70 * Math.sin(w) - 30,
      a2u: 110 + 70 * Math.sin(w + 1.6), a2f: 110 + 70 * Math.sin(w + 1.6) + 30, l1u: -12, l1l: -30, l2u: 18, l2l: 22 }; },
  lookDown: { t: 18, h: 34, a1u: -14, a1f: -8, a2u: 22, a2f: 30, l1u: -8, l1l: -16, l2u: 12, l2l: 10 },
  surprised: { t: -10, h: -16, a1u: -125, a1f: -160, a2u: 125, a2f: 160, l1u: -10, l1l: -12, l2u: 10, l2l: 12 },
  reachUp: { t: 4, h: -26, a1u: -20, a1f: -10, a2u: 150, a2f: 168, l1u: -6, l1l: -8, l2u: 8, l2l: 6 },
  press: { t: 10, h: -20, a1u: -24, a1f: -14, a2u: 140, a2f: 150, l1u: -8, l1l: -14, l2u: 14, l2l: 6 },
  cheer: { t: -6, h: -14, a1u: -155, a1f: -172, a2u: 155, a2f: 172, l1u: -16, l1l: -40, l2u: 16, l2l: -20 },
  fear: { t: 14, h: 26, a1u: 150, a1f: 245, a2u: 160, a2f: 255, l1u: 40, l1l: -26, l2u: 52, l2l: -10 },
  peek: { t: 6, h: -6, a1u: 120, a1f: 200, a2u: 70, a2f: 150, l1u: 30, l1l: -20, l2u: 40, l2l: -6 },
  smug: { t: -6, h: -12, a1u: 28, a1f: 100, a2u: 22, a2f: 96, l1u: -10, l1l: -10, l2u: 12, l2l: 12 },
  hop: { t: 6, h: -24, a1u: 150, a1f: 165, a2u: 160, a2f: 175, l1u: 30, l1l: -40, l2u: 46, l2l: -10 },
  crouch: { t: 26, h: -20, a1u: -40, a1f: -20, a2u: -30, a2f: -10, l1u: 70, l1l: -40, l2u: 80, l2l: -30 },
  escape: { t: 30, h: -30, a1u: 150, a1f: 175, a2u: 130, a2f: 160, l1u: -40, l1l: -95, l2u: 55, l2l: 30 },
  tuck: { t: 10, h: -10, a1u: -140, a1f: -170, a2u: 150, a2f: 175, l1u: 70, l1l: -20, l2u: 90, l2l: 10 },
  flat: { t: 0, h: 0, a1u: -165, a1f: -170, a2u: 165, a2f: 170, l1u: -10, l1l: -8, l2u: 10, l2l: 8 },
  hold: { t: 4, h: 10, a1u: -12, a1f: -6, a2u: 72, a2f: 92, l1u: -6, l1l: -8, l2u: 8, l2l: 6 },
  reachIn: { t: 18, h: 14, a1u: 60, a1f: 80, a2u: 78, a2f: 95, l1u: -14, l1l: -18, l2u: 18, l2l: 6 },
  exhale: { t: 12, h: 18, a1u: 4, a1f: 2, a2u: 6, a2f: 4, l1u: -6, l1l: -6, l2u: 6, l2l: 6 },
  raise: { t: -4, h: -6, a1u: -10, a1f: -6, a2u: 120, a2f: 178, l1u: -6, l1l: -6, l2u: 6, l2l: 6 },
};
const tremble = (pose, t, amp = 3) => t2 => { const p = ev(pose, t2); return { ...p, t: p.t + amp * Math.sin(t2 * 70), h: p.h + amp * Math.sin(t2 * 55) }; };

// ───────────────────────── рисование стикмена ─────────────────────────
const L = { torso: 96, head: 31, ua: 52, fa: 48, th: 62, sh: 62 };
function skeleton(p, f) {
  const H0 = { x: 0, y: 0 };
  const ta = p.t * D2R;
  const N = { x: Math.sin(ta) * L.torso * f, y: -Math.cos(ta) * L.torso };
  const ha = (p.t + p.h) * D2R;
  const Hd = { x: N.x + Math.sin(ha) * (L.head + 6) * f, y: N.y - Math.cos(ha) * (L.head + 6) };
  const S = { x: N.x - Math.sin(ta) * 10 * f, y: N.y + Math.cos(ta) * 10 };
  const limb = (o, u, l, lu, ll) => { const K = { x: o.x + Math.sin(u * D2R) * lu * f, y: o.y + Math.cos(u * D2R) * lu };
    return [K, { x: K.x + Math.sin(l * D2R) * ll * f, y: K.y + Math.cos(l * D2R) * ll }]; };
  const [E1, W1] = limb(S, p.a1u, p.a1f, L.ua, L.fa), [E2, W2] = limb(S, p.a2u, p.a2f, L.ua, L.fa);
  const [K1, F1] = limb(H0, p.l1u, p.l1l, L.th, L.sh), [K2, F2] = limb(H0, p.l2u, p.l2l, L.th, L.sh);
  return { H0, N, Hd, S, E1, W1, E2, W2, K1, F1, K2, F2 };
}
// st: {x, y(ступни/земля), f, pose, s, rot, lift, alpha, ghost, sq, eyes, finger}
function drawStick(st, t) {
  if (!st || st.alpha <= 0) return;
  const p = ev(st.pose, t), f = st.f || 1, s = (st.s || 1) * SCALE;
  const sk = skeleton(p, f);
  const lowFoot = Math.max(sk.F1.y, sk.F2.y);
  ctx.save();
  ctx.translate(st.x, st.y - (st.lift || 0) * s);
  const sq = st.sq || 1;
  ctx.scale(s / Math.sqrt(sq), s * sq);
  if (st.rot) { ctx.translate(0, -lowFoot - 60); ctx.rotate(st.rot * D2R); ctx.translate(0, 60); } else ctx.translate(0, -lowFoot);
  ctx.globalAlpha = st.alpha ?? 1;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const ghost = st.ghost;
  const col = ghost ? GHOST.line : HERO.line;
  if (ghost) { ctx.shadowColor = GHOST.glow; ctx.shadowBlur = 26; }
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 15;
  const seg = (...pts) => { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (const q of pts.slice(1)) ctx.lineTo(q.x, q.y); ctx.stroke(); };
  seg(sk.S, sk.E1, sk.W1); seg(sk.H0, sk.K1, sk.F1);
  seg(sk.H0, sk.N); seg(sk.H0, sk.K2, sk.F2); seg(sk.S, sk.E2, sk.W2);
  ctx.beginPath(); ctx.arc(sk.Hd.x, sk.Hd.y, L.head, 0, Math.PI * 2); ctx.fill();
  if (st.finger) drawFingerHand(sk.W2, sk.E2, f, st.finger);
  ctx.shadowBlur = 0;
  if (st.eyes) drawEyes(sk.Hd, st.eyes);
  ctx.restore();
}
function drawEyes(c, k) { // взгляд в камеру, «тяжёлые веки»
  ctx.save(); ctx.globalAlpha *= clamp(k);
  for (const dx of [-11, 11]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(c.x + dx, c.y + 2, 8, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(c.x + dx, c.y + 5, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = HERO.fill; ctx.fillRect(c.x + dx - 10, c.y - 9, 20, 9); // веко
  }
  ctx.restore();
}
function drawFingerHand(Wp, Ep, f, k) {
  const ang = Math.atan2(Wp.y - Ep.y, Wp.x - Ep.x);
  ctx.save(); ctx.translate(Wp.x, Wp.y); ctx.rotate(ang + Math.PI / 2);
  ctx.beginPath(); ctx.arc(0, -4, 15, 0, Math.PI * 2); ctx.fill();          // кулак
  if (FINAL_GESTURE === 'finger') { ctx.lineWidth = 11; ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, -12 - 30 * clamp(k)); ctx.stroke(); }
  else { ctx.lineWidth = 11; ctx.beginPath(); ctx.moveTo(4, -10); ctx.lineTo(4 + 22 * clamp(k), -22); ctx.stroke(); }
  ctx.restore();
}

// ───────────────────────── кнопки ─────────────────────────
function drawButton(x, y, scale, label, rew, extra = {}) {
  if (scale <= 0.01) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(scale * (extra.sx || 1), scale * (extra.sy || 1)); ctx.rotate((extra.rot || 0) * D2R);
  ctx.font = '900 54px Inter'; const tw = ctx.measureText(label).width;
  const w = tw + 150, h = 110, r = 30;
  ctx.shadowColor = 'rgba(255,40,70,0.95)'; ctx.shadowBlur = 50;
  ctx.fillStyle = extra.flash ? '#ff8095' : RED;
  roundRect(-w / 2, -h / 2, w, h, r); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; roundRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, r - 8); ctx.stroke();
  ctx.fillStyle = '#fff';
  // значок ⏭ / ⏪ — два треугольника
  const ix = -w / 2 + 34, dir = rew ? -1 : 1;
  ctx.save(); ctx.translate(ix + 34, 0); ctx.scale(dir, 1);
  for (const off of [-22, 6]) { ctx.beginPath(); ctx.moveTo(off, -22); ctx.lineTo(off + 26, 0); ctx.lineTo(off, 22); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  ctx.font = '900 54px Inter'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText(label, -w / 2 + 108, 3);
  ctx.restore();
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
// анимация появления/нажатия: 0 → 1.15 → 1, при нажатии сжатие
function btnScale(t, tIn, tPress, tOut) {
  if (t < tIn || t > tOut + .25) return 0;
  let s = E.back(win(t, tIn, tIn + .28));
  if (tPress != null && t >= tPress - .08) { const k = win(t, tPress - .08, tPress + .16); s *= 1 - .22 * Math.sin(k * Math.PI); }
  if (t > tOut) s *= 1 - E.in(win(t, tOut, tOut + .25));
  return s;
}

// ───────────────────────── фон ─────────────────────────
function makeLayer(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return c; }
const SKY = makeLayer(W, H, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#1e1d4d'); gr.addColorStop(.30, '#4a3a7c'); gr.addColorStop(.50, '#b4598c'); gr.addColorStop(.62, '#f08a7a'); gr.addColorStop(.70, '#ffc27a'); gr.addColorStop(1, '#ffd9a0');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const sun = g.createRadialGradient(560, 1150, 10, 560, 1150, 620);
  sun.addColorStop(0, 'rgba(255,245,210,1)'); sun.addColorStop(.12, 'rgba(255,220,160,.85)'); sun.addColorStop(.45, 'rgba(255,150,120,.25)'); sun.addColorStop(1, 'rgba(255,120,120,0)');
  g.fillStyle = sun; g.fillRect(0, 0, w, h);
  const rnd = mulberry(7);
  g.filter = 'blur(18px)';
  for (let i = 0; i < 26; i++) { const y = 180 + rnd() * 760, x = rnd() * w, rw = 160 + rnd() * 340, rh = 30 + rnd() * 60;
    const k = y / 940; g.fillStyle = `rgba(${Math.round(lerp(150, 255, k))},${Math.round(lerp(120, 170, k))},${Math.round(lerp(190, 170, k))},${.35 + rnd() * .3})`;
    g.beginPath(); g.ellipse(x, y, rw, rh, 0, 0, Math.PI * 2); g.fill(); }
  g.filter = 'none';
});
function ridge(g, w, base, amp, rough, seed, color, step = 40) {
  const rnd = mulberry(seed); g.fillStyle = color; g.beginPath(); g.moveTo(0, 2200);
  let y = base; for (let x = 0; x <= w + step; x += step) { y = clamp(y + (rnd() - .5) * rough, base - amp, base + amp * .3); if (rnd() < .08) y -= amp * .5 * rnd(); g.lineTo(x, y); }
  g.lineTo(w, 2200); g.closePath(); g.fill();
}
const FAR = makeLayer(2400, 1920, (g, w) => { ridge(g, w, 1080, 160, 60, 3, 'rgba(126,92,150,0.75)', 30); });
const MID = makeLayer(3600, 1920, (g, w) => {
  // столовые горы
  const rnd = mulberry(11); g.fillStyle = '#4b3766';
  for (let x = -100; x < w; x += 260 + rnd() * 300) { const top = 980 + rnd() * 180, ww = 160 + rnd() * 260;
    g.beginPath(); g.moveTo(x, 1920); g.lineTo(x + 30, top + 40); g.lineTo(x + 50, top); g.lineTo(x + ww - 40, top + rnd() * 20); g.lineTo(x + ww, top + 60); g.lineTo(x + ww + 40, 1920); g.fill(); }
  ridge(g, w, 1160, 60, 40, 13, '#3a2b55', 24);
});
function drawBackground(cx, cy, z, clockSpin) {
  ctx.drawImage(SKY, 0, 0);
  drawClock(clockSpin);
  const par = (img, p, py) => { const ox = -((cx * p) % img.width + img.width) % img.width; const oy = (960 - cy) * py;
    ctx.drawImage(img, ox, oy); ctx.drawImage(img, ox + img.width, oy); };
  par(FAR, .08, .05); par(MID, .25, .15);
}
function drawClock(spin) {
  ctx.save(); ctx.translate(760, 520); ctx.globalAlpha = .16; ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(0, 0, 230, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(Math.sin(a) * 200, -Math.cos(a) * 200); ctx.lineTo(Math.sin(a) * 222, -Math.cos(a) * 222); ctx.stroke(); }
  ctx.lineWidth = 9; const a1 = spin, a2 = spin / 12;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(a1) * 175, -Math.cos(a1) * 175); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(a2) * 110, -Math.cos(a2) * 110); ctx.stroke();
  ctx.restore();
}
// передний план в мировых координатах (после трансформации камеры)
const ROCKS = (() => { const r = mulberry(21), a = []; for (let x = -600; x < 4600; x += 50 + r() * 140) a.push([x, 6 + r() * 16, r()]); return a; })();
function drawGround(Tw, ep) {
  const pitOpen = ep ? 0 : E.out(win(Tw, .35, .8));
  const g = ctx;
  const groundFill = g.createLinearGradient(0, G, 0, G + 700);
  groundFill.addColorStop(0, '#2c2140'); groundFill.addColorStop(1, '#120d1e');
  g.fillStyle = groundFill;
  // левая часть до пропасти, правая после
  g.fillRect(-1200, G, PIT[0] + 1200, 1400);
  g.fillRect(PIT[1], G, WALL_X + 2000 - PIT[1], 1400);
  // кусок земли над пропастью — проваливается
  if (pitOpen < 1) { g.save(); g.globalAlpha = 1 - pitOpen; g.translate(0, pitOpen * 500);
    g.fillRect(PIT[0] - 1, G, PIT[1] - PIT[0] + 2, 1400); g.restore(); }
  if (pitOpen > 0) { // стенки пропасти и дно
    g.fillStyle = '#0d0916'; g.fillRect(PIT[0], G + 40, PIT[1] - PIT[0], 1400);
    g.fillStyle = '#3a2b52'; g.fillRect(PIT[0] + 40, G + 470, 70, 20); // уступ, на котором прыгает двойник
    const sh = g.createLinearGradient(0, G, 0, G + 400); sh.addColorStop(0, 'rgba(0,0,0,.0)'); sh.addColorStop(1, 'rgba(0,0,0,.6)');
    g.fillStyle = sh; g.fillRect(PIT[0], G, PIT[1] - PIT[0], 600);
  }
  // контровой свет по кромке
  g.strokeStyle = 'rgba(255,190,140,0.85)'; g.lineWidth = 5;
  g.beginPath(); g.moveTo(-1200, G + 2); g.lineTo(PIT[0], G + 2); g.moveTo(PIT[1], G + 2); g.lineTo(WALL_X, G + 2); g.stroke();
  if (pitOpen > 0 && pitOpen < 1) { // летящие обломки
    const r = mulberry(5); g.fillStyle = '#2c2140';
    for (let i = 0; i < 14; i++) { const x = PIT[0] + r() * (PIT[1] - PIT[0]), sz = 12 + r() * 26; g.fillRect(x, G + pitOpen * (300 + r() * 600), sz, sz); }
  }
  g.fillStyle = '#21182f';
  for (const [x, sz] of ROCKS) if (x < PIT[0] - 20 || (x > PIT[1] + 20 && x < WALL_X - 30)) { g.beginPath(); g.ellipse(x, G + 4, sz * 1.6, sz, 0, Math.PI, 0); g.fill(); }
  // стена сцены 5

const SKIPS = [[3.55, 4.45, 1, 'ff'], [9.55, 10.05, 1, 'ff'], [13.95, 14.2, .7, 'ff'], [14.85, 15.1, .7, 'ff'], [15.75, 16.0, .7, 'ff'], [16.65, 16.9, .7, 'ff']];

// ───────────────────────── кадр ─────────────────────────
function worldTime(t) {
  if (t < 25.0) return { T: t, ep: false };
  if (t < 27.4) { const k = win(t, 25.0, 27.4); return { T: 24.3 - (24.3 - 0.45) * E.io(k), ep: false, rew: k }; }

}
let clockAcc = 0;
function clockAngle(t, T) { // минутная стрелка: идёт, при пропусках — рывок вперёд, при перемотке — назад
  let a = T * .5; for (const [s0, s1] of SKIPS) a += 6 * E.io(win(T, s0, s1));
  if (t >= 27.4) a = 0.45 * .5 + (t - 27.4) * .5;
  return a;
}
function drawFrame(t) {
  const { T, ep, rew } = worldTime(t);
  const C = ep ? camEp : cam, Tc = ep ? t : T;
  let cx = C.cx(Tc), cy = C.cy(Tc), z = C.z(Tc);
  // тряска: удар наковальни, синхронный щелчок
  const shake = (ep ? 0 : (Math.max(0, 1 - Math.abs(T - 10.0) * 6) * 18 + Math.max(0, 1 - Math.abs(T - 24.35) * 5) * 22)) + (rew ? 10 * Math.sin(rew * Math.PI) : 0);
  if (shake > 0) { cx += Math.sin(t * 97) * shake; cy += Math.cos(t * 83) * shake; }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.filter = 'none';
  drawBackground(cx, cy, z, clockAngle(t, T));
  ctx.setTransform(z, 0, 0, z, 540 - cx * z, 960 - cy * z);
  drawGround(ep ? 99 : T, ep);

  if (!ep) {
    // наковальня: падает 8.6–9.6, после пропуска лежит
    if (T >= 8.3) {
      const kf = win(T, 8.3, 9.9), fallY = T < 10.0 ? lerp(-60, 860, kf * kf) : G;
      const sk = T < 10.0 ? win(T, 8.5, 9.6) : 1;
      drawAnvil(1170, fallY, T < 10 ? -6 + 4 * Math.sin(T * 6) : 0, sk);
      if (T >= 10.0 && T < 11.2) drawDust(1170, G, win(T, 10.0, 11.2));
    }
    // двойники
    const order = T > 19 ? [3, 4, 5, 2, 1, 0] : [0, 1, 2, 3, 4, 5];
    for (const gi of order) { const gh = ghosts[gi];
      if (T < gh.born) continue;
      const st = gh.st(T); if (!st) continue;
      const appear = E.out(win(T, gh.born, gh.born + .25));
      drawStick({ ...st, ghost: true, alpha: .8 * appear, s: (st.s || .95) }, T);
      // кнопка −5 у двойника 1
      if (gh.id === 1 && T > 21.9) {
        const sc = (st.s || .95) * SCALE, sk = skeleton(ev(st.pose, T), 1);
        const bs = .62 * E.back(win(T, 21.9, 22.3)) * (1 - .25 * Math.sin(win(T, 24.25, 24.5) * Math.PI));
        drawButton(st.x + sk.W2.x * sc + 95, st.y + (sk.W2.y - Math.max(sk.F1.y, sk.F2.y)) * sc - 10, bs, '−5 SEC', true, { flash: T > 24.3 && T < 24.45 });
      }
    }
    // герой (+ шлейф при беге)
    const hx = heroTrack.x(T), hp = heroTrack.pose, hf = heroTrack.f(T), hl = heroTrack.lift(T);
    if (T > 13.1 && T < 19.1) for (const d of [.06, .03]) drawStick({ x: heroTrack.x(T - d), y: G, pose: hp, f: hf, alpha: .18 }, T - d);
    if (T > 13.1 && T < 19.1) drawSpeedLines(hx - 90, G - 150, T);
    drawStick({ x: hx, y: G, pose: hp, f: hf, lift: hl, sq: squashAt(T) }, T);
    // кнопки героя над головой
    for (const [tin, tp, tout] of HERO_BUTTONS) {
      const s = btnScale(T, tin, tp, tout); if (!s) continue;
      drawButton(hx + 40, G - 480 - (hl || 0) * SCALE, s * .9, '+5 SEC', false, { flash: T > tp && T < tp + .1 });
    }
  } else {
    // эпилог: снова начало
    const hx = heroEp.x(t);
    const eyes = win(t, 28.35, 28.55) * (t < 29.75 ? 1 : 0);
    const finger = t > 28.75 && t < 29.75 ? E.back(win(t, 28.8, 29.05)) : 0;
    drawStick({ x: hx, y: G, pose: heroEp.pose, f: 1, eyes, finger }, t);
    if (t > 27.75 && t < 28.3) drawPuff(hx + 60, G - 330, win(t, 27.75, 28.3));
    if (t >= 28.0 && t < 29.75) { // кнопка: появляется, обижается и исчезает
      const s = btnScale(t, 28.0, null, 29.45) * .9;
      const wr = win(t, 29.05, 29.45);
      drawButton(hx + 125, G - 500, s * (1 - .35 * wr), '+5 SEC', false, { sx: 1 + .08 * Math.sin(t * 60) * wr, sy: 1 - .3 * wr, rot: -8 * wr });
      if (t > 29.45) drawPop(hx + 125, G - 500, win(t, 29.45, 29.7));
    }
  }

  // ── экранные эффекты ──
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!ep) for (const [s0, s1, amp] of SKIPS) { const k = win(T, s0, s1); if (k > 0 && k < 1) skipFX(Math.sin(k * Math.PI) * amp, t, false); }
  if (!ep && T > 24.3 && !rew) skipFX(E.in(win(T, 24.3, 25.0)) * .9, t, true);
  if (rew) skipFX(.65 + .35 * Math.sin(rew * Math.PI), t, true);

}
function squashAt(T) { // приземления героя — сжатие/растяжение
  let s = 1; for (const tl of [4.35, 4.95, 5.6]) { const k = win(T, tl - .02, tl + .16); if (k > 0 && k < 1) s *= 1 - .16 * Math.sin(k * Math.PI); }

function drawSpeedLines(x, y, T) { ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  const r = mulberry(Math.floor(T * 15)); for (let i = 0; i < 5; i++) { const yy = y + r() * 220, ll = 60 + r() * 90; ctx.beginPath(); ctx.moveTo(x - 30 - r() * 40, yy); ctx.lineTo(x - 30 - ll, yy); ctx.stroke(); } ctx.restore(); }

  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2, r0 = 40 + 120 * E.out(k); ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); ctx.lineTo(x + Math.cos(a) * (r0 + 30), y + Math.sin(a) * (r0 + 30)); ctx.stroke(); }
  ctx.restore(); }
// полосы перемотки + значок ▶▶/◀◀ + глитч-сдвиг полос кадра
const FX = document.createElement('canvas'); FX.width = W; FX.height = H; const fx = FX.getContext('2d');
function skipFX(a, t, rew) {

  const fi = Math.floor(t * 30), r = mulberry(fi * 13 + 1);

}
function vignette() { const g = ctx.createRadialGradient(540, 960, 600, 540, 960, 1250); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(10,5,25,.45)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }

window.renderFrame = (t) => drawFrame(Math.min(t, 29.999));
window.READY = document.fonts.load('900 54px Inter').then(() => drawFrame(0));
</script>

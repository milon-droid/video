<script>
'use strict';
window.SCENE = { duration: 30, fps: 30, width: 1080, height: 1920 };
const W = 1080, H = 1920;
const FINAL_GESTURE = 'finger';        // 'finger' | 'flick'
const RED = '#ff2a4a';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ───────── утилиты ─────────

// ───────── позы (градусы; конечности: 0 = вниз, + = вперёд) ─────────
const BASE = { t: 0, h: 0, a1u: -8, a1f: -4, a2u: 8, a2f: 4, l1u: -6, l1l: -6, l2u: 6, l2l: 6 };

  stand: { ...BASE },

  lookBackRun: t => ({ ...runPh(t * 2.2, 40, 'panic'), h: -60 }),
  backRun: t => ({ ...runPh(t * 2.2), t: -10, h: 8 }),
  brake: { t: -26, h: -12, a1u: -110, a1f: -140, a2u: 120, a2f: 150, l1u: -20, l1l: -52, l2u: 38, l2l: 46 },

  press: { t: 10, h: -20, a1u: -24, a1f: -14, a2u: 140, a2f: 150, l1u: -8, l1l: -14, l2u: 14, l2l: 6 },

  smug: { t: -6, h: -12, a1u: 28, a1f: 100, a2u: 22, a2f: 96, l1u: -10, l1l: -10, l2u: 12, l2l: 12 },
  angry: { t: 12, h: 8, a1u: -30, a1f: 40, a2u: 30, a2f: 100, l1u: -14, l1l: -14, l2u: 14, l2l: 14 },
  point: { t: 8, h: 0, a1u: -20, a1f: 20, a2u: 85, a2f: 92, l1u: -12, l1l: -12, l2u: 12, l2l: 12 },
  hang: { t: 0, h: -20, a1u: 175, a1f: 178, a2u: 185, a2f: 182, l1u: 10, l1l: 30, l2u: -10, l2l: -20 },
  scramble: t => { const w = t * 12; return { t: 35, h: -25, a1u: 120 + 30 * Math.sin(w), a1f: 150, a2u: 130 - 30 * Math.sin(w), a2f: 160, l1u: 40 + 40 * Math.sin(w), l1l: -30, l2u: 40 - 40 * Math.sin(w), l2l: -20 }; },
  fall: t => { const w = t * 8; return { t: -20, h: -30, a1u: -150 + 30 * Math.sin(w), a1f: -170 + 30 * Math.sin(w), a2u: 150 + 30 * Math.sin(w + 2), a2f: 170 + 30 * Math.sin(w + 2), l1u: -30 + 25 * Math.sin(w + 1), l1l: -60, l2u: 40 - 25 * Math.sin(w + 1), l2l: 10 }; },
  tuck: { t: 10, h: -10, a1u: -140, a1f: -170, a2u: 150, a2f: 175, l1u: 70, l1l: -20, l2u: 90, l2l: 10 },
  flat: { t: 0, h: 0, a1u: -165, a1f: -170, a2u: 165, a2f: 170, l1u: -10, l1l: -8, l2u: 10, l2l: 8 },
  splat: { t: 0, h: 0, a1u: -80, a1f: -80, a2u: 80, a2f: 80, l1u: -40, l1l: -40, l2u: 40, l2l: 40 },
  dodge: { t: -30, h: -30, a1u: -160, a1f: -175, a2u: 170, a2f: 185, l1u: -50, l1l: -90, l2u: 60, l2l: 20 },
  hold: { t: 4, h: 10, a1u: -12, a1f: -6, a2u: 72, a2f: 92, l1u: -6, l1l: -8, l2u: 8, l2l: 6 },
  reachIn: { t: 18, h: 14, a1u: 60, a1f: 80, a2u: 78, a2f: 95, l1u: -14, l1l: -18, l2u: 18, l2l: 6 },
  exhale: { t: 14, h: 22, a1u: 4, a1f: 2, a2u: 6, a2f: 4, l1u: -6, l1l: -6, l2u: 6, l2l: 6 },
  raise: { t: -4, h: -6, a1u: -10, a1f: -6, a2u: 120, a2f: 178, l1u: -6, l1l: -6, l2u: 6, l2l: 6 },
  bonk: { t: -30, h: -30, a1u: -60, a1f: -80, a2u: 60, a2f: 80, l1u: 10, l1l: 10, l2u: 30, l2l: 30 },

// ───────── стикмен ─────────

// шаг без проскальзывания: опорная ступня стоит на месте, таз «переступает» через неё

// лица: согласованная система выражений с первой сцены
const FACES = {
  neutral: { eye: 1, lid: .1, brow: 0, mouth: 'line' }, surprised: { eye: 1.3, lid: 0, brow: -1, mouth: 'o' },
  scared: { eye: 1.25, lid: 0, brow: 'worry', mouth: 'wave' }, panic: { eye: 1.4, pupil: .5, lid: 0, brow: 'worry', mouth: 'open' },
  relieved: { eye: 'closed', brow: 0, mouth: 'smile' }, happy: { eye: 'closed', brow: -1, mouth: 'grin' },
  angry: { eye: .95, lid: .45, brow: 'v', mouth: 'frown' }, suspicious: { eye: .9, lid: .55, brow: 'flat', mouth: 'line' },
  annoyed: { eye: 1, lid: .6, brow: 'flat', mouth: 'flat' }, dizzy: { eye: 'x', brow: 0, mouth: 'wave' },

function drawFace(Hd, ha, f, face, ghost, look) {

// st: x, y (земля), s, f, pose, lift, rot, sq, alpha, ghost, shade, face, look, eyes(старое: =look cam), finger, emo, emoK, shadow, glitch
function drawStick(st, t) {

rshot(.5, B1, .9, .9, 0, [[.4, 'pop', { gain: .45, pitch: 1.1 }]]);
rshot(.55, A1, 2.2, 1.0, 0);
shot(0.5, lt => { setCam(540, 980, 1.05); drawBG('bg0'); drawStick({ x: 120, y: g0(120), s: H1, pose: P.stand, face: 'neutral' }, lt);
  pulseRing(160, 900, clamp(.4 + lt)); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = .4 * (1 - win(lt, 0, .5)); neonClock(540, 900, .9, 0); ctx.globalAlpha = 1; });

// ═══ Ж. ФИНАЛ: предложение → взгляд → отказ → реакция кнопки ═══
shot(1.4, lt => { setCam(540, 980, 1.05); drawBG('bg0');
  drawStick({ x: 120, y: g0(120), s: H1, pose: K([[0, P.stand], [.3, { ...P.stand, h: -15 }], [.6, { ...P.stand, h: 15 }], [.85, P.exhale], [1.4, P.exhale]])(lt), face: lt < .85 ? 'surprised' : 'relieved', emo: lt < .8 ? '?' : null, emoK: win(lt, .2, .35) }, lt);
  if (lt > .85) drawPuff(190, g0(120) - 330, win(lt, .85, 1.35));
}, [[.9, 'puff', { dur: .55, gain: .4 }]]);
shot(1.0, lt => { setCam(230, 930, 1.75); drawBG('bg0');
  drawStick({ x: 140, y: g0(140), s: H1, pose: K([[0, P.exhale], [.3, { ...P.stand, h: -20 }]])(lt), face: lt < .3 ? 'relieved' : 'suspicious', emo: '...', emoK: win(lt, .45, .6) }, lt);
  crackFX(290, 760, win(lt, .05, .3)); btn(290, 760, btnScale(lt, .1, null, 99) * .5);
}, [[.1, 'bloop', { gain: .5 }]]);
shot(1.0, lt => { setCam(220, 830, 2.3); drawBG('bg0'); // взгляд на кнопку → в камеру, пауза
  drawStick({ x: 140, y: g0(140), s: H1, pose: { ...P.stand, h: lt < .4 ? -20 : 0 }, face: 'annoyed', look: lt > .4 ? 'cam' : null }, lt);
  btn(300, 760, .5);
});
shot(1.2, lt => { setCam(220, 830, 2.3); drawBG('bg0');
  drawStick({ x: 140, y: g0(140), s: H1, pose: K([[0, P.stand], [.25, P.raise, 'back']])(lt), face: 'annoyed', look: 'cam', finger: E.back(win(lt, .25, .45)) }, lt);
  btn(300, 760, .5 * (1 + .04 * pulse(lt, .5, .7)));
}, [[.3, 'pop', { gain: .35, pitch: .7 }]]);
shot(1.4, lt => { setCam(240, 820, 2.0); drawBG('bg0'); // кнопка обижается: дрожит, теряет надпись, пустой контур, рассыпается
  drawStick({ x: 140, y: g0(140), s: H1, pose: P.raise, face: 'annoyed', look: 'cam', finger: 1 }, lt);
  const bx = 300, by = 760, wr = win(lt, 0, .45);
  if (lt < .45) drawButton(bx + Math.sin(lt * 70) * 6 * wr, by + 30 * wr, .5 * (1 - .25 * wr), '+5 SEC', false, { sy: 1 - .2 * wr, rot: -10 * wr });
  else if (lt < .85) { ctx.save(); ctx.globalAlpha = 1 - .3 * win(lt, .7, .85); drawButton(bx, by + 30, .38, '+5 SEC', false, { dashed: true }); ctx.restore(); }
  else if (lt < 1.4) { const k = win(lt, .85, 1.4), r = mulberry(77); ctx.save(); ctx.fillStyle = RED; ctx.shadowColor = RED; ctx.shadowBlur = 12;
    for (let i = 0; i < 40; i++) { const px = bx + (r() - .5) * 170, py = by + 30 + (r() - .5) * 60; ctx.globalAlpha = 1 - k; ctx.fillRect(px + (r() - .5) * 200 * k, py + 260 * k * k * r(), 9, 9); } ctx.restore(); }
}, [[0, 'wah', { dur: .45, gain: .5 }], [.85, 'glitch', { dur: .3, gain: .35, pitch: 1.6 }]]);
shot(0.25, () => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); });

window.SCENE.duration = +CUR.toFixed(2);
window.SFX_CUES = SFX;
window.CLONES = CLONES;
function shotAt(T) { for (let i = SHOTS.length - 1; i >= 0; i--) if (T >= SHOTS[i][0]) return SHOTS[i]; return SHOTS[0]; }
function drawFrame(t) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; REVERSE = false; shotAt(t)[2](t); if (t < CUR - .25) vignette(); }
window.renderFrame = t => drawFrame(Math.min(t, CUR - 0.001));
window.READY = Promise.all([BG_READY, document.fonts.load('900 54px Inter')]).then(() => drawFrame(0));
</script>

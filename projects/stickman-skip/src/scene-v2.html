<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пропущенные секунды v2</title>
<!--
  Стикмен «Пропущенные секунды», v2 — монтаж из отдельных планов на фонах пользователя.
  1080×1920, 30 fps, 30 с. Кадр зависит только от t (renderFrame).
  Фоны: ../assets/bg/bg0..bg5.jpg (1080×1920). Предыдущая версия: scene-v1-flat.html.
-->
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  canvas { display: block; }
  .fontwarm { position: absolute; left: -9999px; font: 900 40px 'Inter'; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="fontwarm">+5 SEC −5 !?</div>
<script>
'use strict';
window.SCENE = { duration: 30, fps: 30, width: 1080, height: 1920 };
const W = 1080, H = 1920;
const FINAL_GESTURE = 'finger';        // 'finger' | 'flick'
const RED = '#ff2a4a';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ───────── утилиты ─────────
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const D2R = Math.PI / 180;
const E = {
  lin: k => k, io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  out: k => 1 - Math.pow(1 - k, 3), in: k => k * k * k, in2: k => k * k,
  back: k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
};
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ev = (v, t) => typeof v === 'function' ? v(t) : v;
function blend(a, b, k) { if (typeof a === 'number') return lerp(a, b, k); const o = {}; for (const key in a) o[key] = (key in b) ? lerp(a[key], b[key], k) : a[key]; return o; }
function track(keys) {
  return t => {
    if (t <= keys[0][0]) return ev(keys[0][1], t);
    let i = keys.length - 1; while (i > 0 && keys[i][0] > t) i--;
    if (i === keys.length - 1) return ev(keys[i][1], t);
    const [t0, v0] = keys[i], [t1, v1, en] = keys[i + 1];
    return blend(ev(v0, t), ev(v1, t), (E[en || 'io'])(clamp((t - t0) / (t1 - t0))));
  };
}
const win = (t, a, b) => clamp((t - a) / (b - a));
const pulse = (t, a, b) => Math.sin(win(t, a, b) * Math.PI);

// ───────── позы (градусы; конечности: 0 = вниз, + = вперёд) ─────────
const BASE = { t: 0, h: 0, a1u: -8, a1f: -4, a2u: 8, a2f: 4, l1u: -6, l1l: -6, l2u: 6, l2l: 6 };
const P = {
  stand: { ...BASE },
  walk: t => { const w = t * 1.6 * 2 * Math.PI, s = Math.sin(w), c = Math.cos(w), th = 24 * s;
    return { t: 4, h: 0, l1u: th, l1l: th - 34 * Math.max(0, c), l2u: -th, l2l: -th - 34 * Math.max(0, -c), a1u: -18 * s, a1f: -18 * s + 14, a2u: 18 * s, a2f: 18 * s + 14 }; },
  run: t => { const w = t * 2.6 * 2 * Math.PI, s = Math.sin(w), c = Math.cos(w), th = 44 * s;
    return { t: 16, h: -4, l1u: th, l1l: th - 85 * Math.max(0, c), l2u: -th, l2l: -th - 85 * Math.max(0, -c), a1u: -42 * s, a1f: -42 * s + 80, a2u: 42 * s, a2f: 42 * s + 80 }; },
  panicRun: t => { const p = P.run(t), w = t * 2.6 * 2 * Math.PI; return { ...p, t: 22, h: -14, a1u: 150 + 20 * Math.sin(w), a1f: 175, a2u: 160 - 20 * Math.sin(w), a2f: 185 }; },
  lookBackRun: t => ({ ...P.panicRun(t), h: -60 }),
  backRun: t => ({ ...P.run(t), t: -10, h: 8 }),
  brake: { t: -24, h: -10, a1u: -110, a1f: -140, a2u: 120, a2f: 150, l1u: -18, l1l: -50, l2u: 36, l2l: 44 },
  windmill: t => { const w = t * 9; return { t: -14, h: -6, a1u: -100 + 70 * Math.sin(w), a1f: -130 + 70 * Math.sin(w), a2u: 110 + 70 * Math.sin(w + 1.6), a2f: 140 + 70 * Math.sin(w + 1.6), l1u: -12, l1l: -30, l2u: 18, l2l: 22 }; },
  lookDown: { t: 18, h: 34, a1u: -14, a1f: -8, a2u: 22, a2f: 30, l1u: -8, l1l: -16, l2u: 12, l2l: 10 },
  lookUp: { t: -8, h: -45, a1u: -14, a1f: -8, a2u: 14, a2f: 8, l1u: -8, l1l: -8, l2u: 8, l2l: 8 },
  surprised: { t: -10, h: -16, a1u: -125, a1f: -160, a2u: 125, a2f: 160, l1u: -10, l1l: -12, l2u: 10, l2l: 12 },
  reachUp: { t: 4, h: -26, a1u: -20, a1f: -10, a2u: 150, a2f: 168, l1u: -6, l1l: -8, l2u: 8, l2l: 6 },
  press: { t: 10, h: -20, a1u: -24, a1f: -14, a2u: 140, a2f: 150, l1u: -8, l1l: -14, l2u: 14, l2l: 6 },
  cheer: { t: -6, h: -14, a1u: -155, a1f: -172, a2u: 155, a2f: 172, l1u: -16, l1l: -40, l2u: 16, l2l: -20 },
  crouch: { t: 26, h: -20, a1u: -40, a1f: -20, a2u: -30, a2f: -10, l1u: 70, l1l: -40, l2u: 80, l2l: -30 },
  fear: { t: 14, h: 26, a1u: 150, a1f: 245, a2u: 160, a2f: 255, l1u: 40, l1l: -26, l2u: 52, l2l: -10 },
  peek: { t: 6, h: -6, a1u: 120, a1f: 200, a2u: 70, a2f: 150, l1u: 30, l1l: -20, l2u: 40, l2l: -6 },
  smug: { t: -6, h: -12, a1u: 28, a1f: 100, a2u: 22, a2f: 96, l1u: -10, l1l: -10, l2u: 12, l2l: 12 },
  angry: { t: 12, h: 8, a1u: -30, a1f: 40, a2u: 30, a2f: 100, l1u: -14, l1l: -14, l2u: 14, l2l: 14 },
  hang: { t: 0, h: -20, a1u: 175, a1f: 178, a2u: 185, a2f: 182, l1u: 10, l1l: 30, l2u: -10, l2l: -20 },
  fall: t => { const w = t * 8; return { t: -20, h: -30, a1u: -150 + 30 * Math.sin(w), a1f: -170 + 30 * Math.sin(w), a2u: 150 + 30 * Math.sin(w + 2), a2f: 170 + 30 * Math.sin(w + 2), l1u: -30 + 25 * Math.sin(w + 1), l1l: -60, l2u: 40 - 25 * Math.sin(w + 1), l2l: 10 }; },
  tuck: { t: 10, h: -10, a1u: -140, a1f: -170, a2u: 150, a2f: 175, l1u: 70, l1l: -20, l2u: 90, l2l: 10 },
  flat: { t: 0, h: 0, a1u: -165, a1f: -170, a2u: 165, a2f: 170, l1u: -10, l1l: -8, l2u: 10, l2l: 8 },
  splat: { t: 0, h: 0, a1u: -80, a1f: -80, a2u: 80, a2f: 80, l1u: -40, l1l: -40, l2u: 40, l2l: 40 },
  hold: { t: 4, h: 10, a1u: -12, a1f: -6, a2u: 72, a2f: 92, l1u: -6, l1l: -8, l2u: 8, l2l: 6 },
  reachIn: { t: 18, h: 14, a1u: 60, a1f: 80, a2u: 78, a2f: 95, l1u: -14, l1l: -18, l2u: 18, l2l: 6 },
  exhale: { t: 12, h: 18, a1u: 4, a1f: 2, a2u: 6, a2f: 4, l1u: -6, l1l: -6, l2u: 6, l2l: 6 },
  raise: { t: -4, h: -6, a1u: -10, a1f: -6, a2u: 120, a2f: 178, l1u: -6, l1l: -6, l2u: 6, l2l: 6 },
  bonk: { t: -30, h: -30, a1u: -60, a1f: -80, a2u: 60, a2f: 80, l1u: 10, l1l: 10, l2u: 30, l2l: 30 },
};
const tremble = (pose, amp = 3) => t2 => { const p = ev(pose, t2); return { ...p, t: p.t + amp * Math.sin(t2 * 70), h: p.h + amp * Math.sin(t2 * 55) }; };

// ───────── стикмен ─────────
const L = { torso: 96, head: 31, ua: 52, fa: 48, th: 62, sh: 62 };
function skeleton(p, f) {
  const ta = p.t * D2R, N = { x: Math.sin(ta) * L.torso * f, y: -Math.cos(ta) * L.torso };
  const ha = (p.t + p.h) * D2R, Hd = { x: N.x + Math.sin(ha) * (L.head + 6) * f, y: N.y - Math.cos(ha) * (L.head + 6) };
  const S = { x: N.x - Math.sin(ta) * 10 * f, y: N.y + Math.cos(ta) * 10 };
  const limb = (o, u, l, lu, ll) => { const K = { x: o.x + Math.sin(u * D2R) * lu * f, y: o.y + Math.cos(u * D2R) * lu }; return [K, { x: K.x + Math.sin(l * D2R) * ll * f, y: K.y + Math.cos(l * D2R) * ll }]; };
  const [E1, W1] = limb(S, p.a1u, p.a1f, L.ua, L.fa), [E2, W2] = limb(S, p.a2u, p.a2f, L.ua, L.fa);
  const [K1, F1] = limb({ x: 0, y: 0 }, p.l1u, p.l1l, L.th, L.sh), [K2, F2] = limb({ x: 0, y: 0 }, p.l2u, p.l2l, L.th, L.sh);
  return { H0: { x: 0, y: 0 }, N, Hd, S, E1, W1, E2, W2, K1, F1, K2, F2, ha };
}
// st: x, y (земля под ступнями), s, f, pose, lift, rot, sq (сплющивание), alpha, ghost, angry, eyes, finger, emo
function drawStick(st, t) {
  if (!st || st.alpha === 0) return;
  const p = ev(st.pose, t), f = st.f || 1, s = st.s || 1, sk = skeleton(p, f), low = Math.max(sk.F1.y, sk.F2.y);
  ctx.save();
  ctx.translate(st.x, st.y - (st.lift || 0) * s);
  const sq = st.sq || 1; ctx.scale(s / Math.sqrt(sq), s * sq);
  if (st.rot) { ctx.translate(0, -low - 60); ctx.rotate(st.rot * D2R); ctx.translate(0, 60); } else ctx.translate(0, -low);
  ctx.globalAlpha = st.alpha ?? 1; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const path = (lw) => {
    ctx.lineWidth = lw;
    const seg = (...q) => { ctx.beginPath(); ctx.moveTo(q[0].x, q[0].y); for (const r of q.slice(1)) ctx.lineTo(r.x, r.y); ctx.stroke(); };
    seg(sk.S, sk.E1, sk.W1); seg(sk.H0, sk.K1, sk.F1); seg(sk.H0, sk.N); seg(sk.H0, sk.K2, sk.F2); seg(sk.S, sk.E2, sk.W2);
    ctx.beginPath(); ctx.arc(sk.Hd.x, sk.Hd.y, L.head + (lw - 15) / 2, 0, Math.PI * 2); ctx.fill();
  };
  if (st.ghost) {
    ctx.shadowColor = 'rgba(255,255,255,.85)'; ctx.shadowBlur = 22;
    ctx.strokeStyle = ctx.fillStyle = '#3d3b55'; path(21); ctx.shadowBlur = 0;
    ctx.strokeStyle = ctx.fillStyle = '#b9b7cf'; path(13);
  } else {
    ctx.save(); ctx.translate(-3.5, -2.5); ctx.strokeStyle = ctx.fillStyle = '#ffb27a'; path(16); ctx.restore(); // контровой свет заката
    ctx.strokeStyle = ctx.fillStyle = '#0b0b12'; path(15);
  }
  if (st.finger) { ctx.fillStyle = ctx.strokeStyle = st.ghost ? '#b9b7cf' : '#0b0b12'; drawFingerHand(sk.W2, sk.E2, st.finger); }
  if (st.angry) drawBrows(sk.Hd, f, st.angry);
  if (st.eyes) drawEyes(sk.Hd, st.eyes);
  ctx.restore();
  if (st.emo) drawEmo(st, sk, low);
}
function drawBrows(c, f, k) { ctx.save(); ctx.globalAlpha *= clamp(k); ctx.strokeStyle = '#141226'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(c.x + 4 * f, c.y - 16); ctx.lineTo(c.x + 26 * f, c.y - 4); ctx.stroke();
  ctx.fillStyle = '#141226'; ctx.beginPath(); ctx.arc(c.x + 18 * f, c.y + 4, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
function drawEyes(c, k) { ctx.save(); ctx.globalAlpha *= clamp(k);
  for (const dx of [-11, 11]) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(c.x + dx, c.y + 2, 8, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(c.x + dx, c.y + 5, 4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#0b0b12'; ctx.fillRect(c.x + dx - 10, c.y - 9, 20, 9); }
  ctx.restore(); }
function drawFingerHand(Wp, Ep, k) {
  const ang = Math.atan2(Wp.y - Ep.y, Wp.x - Ep.x); ctx.save(); ctx.translate(Wp.x, Wp.y); ctx.rotate(ang + Math.PI / 2);
  ctx.beginPath(); ctx.arc(0, -4, 15, 0, Math.PI * 2); ctx.fill(); ctx.lineWidth = 11; ctx.beginPath();
  if (FINAL_GESTURE === 'finger') { ctx.moveTo(0, -12); ctx.lineTo(0, -12 - 30 * clamp(k)); } else { ctx.moveTo(4, -10); ctx.lineTo(4 + 22 * clamp(k), -22); }
  ctx.stroke(); ctx.restore(); }
// эмоции значками над головой: '!', '!?', '?', 'sweat', 'anger', '...'
function drawEmo(st, sk, low) {
  const k = st.emoK ?? 1; if (k <= 0) return;
  const s = st.s || 1, f = st.f || 1;
  const hx = st.x + sk.Hd.x * s, hy = st.y - (st.lift || 0) * s + (sk.Hd.y - low) * s * (st.sq || 1);
  ctx.save(); ctx.translate(hx + 42 * s * f, hy - 52 * s); ctx.scale(s * E.back(clamp(k)), s * E.back(clamp(k)));
  ctx.lineCap = 'round'; ctx.lineWidth = 7;
  const col = st.ghost ? '#e9e7ff' : '#16121f';
  if (st.emo === 'anger') { ctx.strokeStyle = RED; ctx.lineWidth = 8; for (const [a, b] of [[0, 1], [1.57, 1], [3.14, 1], [4.71, 1]]) { ctx.save(); ctx.rotate(a + .78); ctx.beginPath(); ctx.arc(14, 14, 10, Math.PI, Math.PI * 1.5); ctx.stroke(); ctx.restore(); } }
  else if (st.emo === 'sweat') { ctx.fillStyle = '#9fd8ff'; for (const [dx, dy, r] of [[0, 0, 11], [24, 22, 8]]) { ctx.beginPath(); ctx.moveTo(dx, dy - r * 1.8); ctx.quadraticCurveTo(dx + r, dy, dx, dy + r); ctx.quadraticCurveTo(dx - r, dy, dx, dy - r * 1.8); ctx.fill(); } }
  else if (st.emo === '...') { ctx.fillStyle = col; for (const dx of [0, 20, 40]) { ctx.beginPath(); ctx.arc(dx, 0, 6, 0, Math.PI * 2); ctx.fill(); } }
  else { ctx.fillStyle = col; ctx.font = '900 64px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(st.emo, 0, 0);
    ctx.strokeStyle = col; ctx.lineWidth = 5; for (const a of [-.5, 0, .5]) { ctx.beginPath(); ctx.moveTo(Math.sin(a) * 50 - 10, -Math.cos(a) * 50); ctx.lineTo(Math.sin(a) * 66 - 10, -Math.cos(a) * 66); ctx.stroke(); } }
  ctx.restore();
}

// ───────── кнопки (неон) ─────────
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawButton(x, y, scale, label, rew, ex = {}) {
  if (scale <= 0.01) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(scale * (ex.sx || 1), scale * (ex.sy || 1)); ctx.rotate((ex.rot || 0) * D2R);
  ctx.font = '900 54px Inter'; const tw = ctx.measureText(label).width, w = tw + 160, h = 112, r = 26;
  if (ex.dashed) { // «обиженная» кнопка — пунктирный контур
    ctx.setLineDash([22, 16]); ctx.lineWidth = 9; ctx.strokeStyle = RED; ctx.shadowColor = RED; ctx.shadowBlur = 30; roundRect(-w / 2, -h / 2, w, h, r); ctx.stroke(); ctx.restore(); return; }
  ctx.shadowColor = 'rgba(255,30,60,1)'; ctx.shadowBlur = 60;
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, ex.flash ? '#ff9db0' : '#ff3d5c'); g.addColorStop(1, ex.flash ? '#ff6a85' : '#c8102e');
  ctx.fillStyle = g; roundRect(-w / 2, -h / 2, w, h, r); ctx.fill(); ctx.shadowBlur = 25; ctx.shadowColor = '#fff';
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,235,240,0.95)'; roundRect(-w / 2 + 9, -h / 2 + 9, w - 18, h - 18, r - 9); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff'; ctx.save(); ctx.translate(-w / 2 + 70, 0); ctx.scale(rew ? -1 : 1, 1);
  for (const off of [-24, 4]) { ctx.beginPath(); ctx.moveTo(off, -24); ctx.lineTo(off + 28, 0); ctx.lineTo(off, 24); ctx.closePath(); ctx.fill(); }
  ctx.restore(); ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillText(label, -w / 2 + 116, 3);
  ctx.restore();
}
function btnScale(t, tIn, tPress, tOut) {
  if (t < tIn || t > tOut + .25) return 0;
  let s = E.back(win(t, tIn, tIn + .28));
  if (tPress != null && t >= tPress - .08) s *= 1 - .22 * pulse(t, tPress - .08, tPress + .16);
  if (t > tOut) s *= 1 - E.in(win(t, tOut, tOut + .25));
  return s;
}

// ───────── фоны и камера ─────────
const BG = {}; let bgLoaded = 0;
const BG_READY = Promise.all(['bg0', 'bg1', 'bg2', 'bg3', 'bg4', 'bg5'].map(k => new Promise(res => { const im = new Image(); im.onload = () => { BG[k] = im; res(); }; im.onerror = res; im.src = `../assets/bg/${k}.jpg`; })));
// камера: (cx, cy) — точка фона в центре экрана, z — зум; не выходит за края картинки
function setCam(cx, cy, z, mirror) {
  const hw = 540 / z, hh = 960 / z; cx = clamp(cx, hw, W - hw); cy = clamp(cy, hh, H - hh);
  ctx.setTransform(z, 0, 0, z, 540 - cx * z, 960 - cy * z);
  return { cx, cy, z, mirror };
}
function drawBG(key, mirror) { const im = BG[key]; if (!im) { ctx.fillStyle = '#6a5a9a'; ctx.fillRect(0, 0, W, H); return; }
  if (mirror) { ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1); ctx.drawImage(im, 0, 0, W, H); ctx.restore(); } else ctx.drawImage(im, 0, 0, W, H); }
const g0 = x => 1066 + clamp(x / 610) * 10; // земля плато на bg0

// ───────── реквизит ─────────
function drawAnvil(x, y, s = 1, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(rot * D2R);
  const gr = ctx.createLinearGradient(0, -150, 0, 0); gr.addColorStop(0, '#6b6470'); gr.addColorStop(.35, '#3a3640'); gr.addColorStop(1, '#16141a');
  ctx.fillStyle = gr; ctx.beginPath();
  ctx.moveTo(-170, -150); ctx.lineTo(130, -150); ctx.quadraticCurveTo(195, -150, 215, -116); ctx.lineTo(80, -100); ctx.lineTo(60, -60);
  ctx.lineTo(95, 0); ctx.lineTo(-95, 0); ctx.lineTo(-60, -60); ctx.lineTo(-90, -100); ctx.lineTo(-170, -112); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#ffb27a'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-166, -147); ctx.lineTo(128, -147); ctx.quadraticCurveTo(190, -147, 208, -118); ctx.stroke();
  ctx.restore();
}
function drawShadow(x, y, w, k) { ctx.save(); ctx.fillStyle = `rgba(20,10,40,${.55 * k})`; ctx.beginPath(); ctx.ellipse(x, y, w, w * .16, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
function drawDust(x, y, k, s = 1) { ctx.save(); const r = mulberry(9); for (let i = 0; i < 24; i++) { const a = (r() - .5) * Math.PI, d = (60 + r() * 220) * s;
  ctx.fillStyle = `rgba(235,205,200,${.55 * (1 - k)})`; ctx.beginPath(); ctx.arc(x + Math.sin(a) * d * E.out(k) * 1.6, y - 20 * s - Math.abs(Math.cos(a)) * d * E.out(k) * .5, (16 + 30 * k) * s, 0, Math.PI * 2); ctx.fill(); } ctx.restore(); }
function drawPebbles(x, y, k, n = 7, spread = 60, depth = 520) { const r = mulberry(31); ctx.save(); ctx.fillStyle = '#5b4d70';
  for (let i = 0; i < n; i++) { const dx = (r() - .3) * spread, sz = 8 + r() * 14, kk = clamp(k * (1 + r() * .5)); ctx.globalAlpha = 1 - kk * .8;
    ctx.save(); ctx.translate(x + dx + kk * 30, y + kk * kk * depth * (0.7 + r() * .6)); ctx.rotate(kk * 6); ctx.fillRect(-sz / 2, -sz / 2, sz, sz); ctx.restore(); } ctx.restore(); }
function drawPuff(x, y, k) { ctx.save(); ctx.fillStyle = `rgba(255,255,255,${.85 * (1 - k)})`; for (const [dx, dy, r] of [[0, 0, 16], [20, -8, 13], [36, 4, 11]]) { ctx.beginPath(); ctx.arc(x + dx * (1 + k * 2), y + dy, r * (1 + k), 0, Math.PI * 2); ctx.fill(); } ctx.restore(); }

    drawStick({ x, y: 1065, s: 1.25, pose: track([[19.0, P.panicRun], [19.2, P.panicRun], [19.25, P.bonk, 'out'], [19.55, P.bonk], [19.8, tremble(P.fear, 3)]])(T), f: T > 19.55 ? -1 : 1,
      sq: 1 - .18 * pulse(T, 19.2, 19.4), emo: T < 19.6 ? '!' : 'sweat', emoK: win(T, 19.22, 19.35) }, T);
    if (T > 19.22) drawBurst(875, 790, win(T, 19.22, 19.6), '#fff8c0', 8, 20, 22);
  }],
  // 18. Снизу: двойники нависают со всех сторон (взгляд героя)
  [20.0, 20.8, T => { setCam(540, 700, 1.25); drawBG('bg4');
    ctx.fillStyle = 'rgba(30,15,50,.25)'; ctx.fillRect(0, 0, W, H);
    const k = E.out(win(T, 20.0, 20.8)), ring = [[60, 1700, -25], [300, 1850, -8], [560, 1880, 4], [820, 1830, 14], [1040, 1700, 26], [180, 1420, -30]];
    ring.forEach(([x, y, r], i) => { ctx.save(); ctx.translate(540 + (x - 540) * (1.25 - .25 * k), y + 120 * (1 - k)); ctx.rotate(r * D2R);
      drawStick({ x: 0, y: 0, s: 3.4, pose: { ...P.angry, h: 25 }, f: x < 540 ? 1 : -1, ghost: true, angry: 1 }, T); ctx.restore(); });
  }],
  // 19. Средний: герой сжался у стены, двойники на переднем плане
  [20.8, 21.6, T => { setCam(700, 1020, 1.45, true); drawBG('bg5', true);
    drawStick({ x: 820, y: 1065, s: 1.25, pose: tremble(P.fear, 3), f: -1, emo: 'sweat', emoK: 1 }, T);
    [[470, 1110, 1.6], [600, 1150, 1.75], [340, 1160, 1.75]].forEach(([x, y, s], i) => drawStick({ x, y, s, pose: P.angry, f: 1, ghost: true, angry: 1, alpha: .95 }, T + i));
  }],
  // 20. Вставка: двойник достаёт кнопку −5
  [21.6, 22.4, T => { setCam(600, 900, 2.0, true); drawBG('bg5', true);
    drawStick({ x: 470, y: 1180, s: 1.7, pose: track([[21.6, P.angry], [21.95, P.hold, 'back']])(T), ghost: true, angry: 1 }, T);
    drawButton(700, 930, btnScale(T, 21.95, null, 99) * .78, '−5 SEC', true);
    if (T > 21.95) drawBurst(700, 930, win(T, 21.95, 22.35), RED, 10, 70, 26);
  }],
  // 21. Крупно: герой выглядывает — удивлён
  [22.4, 23.0, T => { setCam(780, 860, 2.3, true); drawBG('bg5', true);
    drawStick({ x: 820, y: 1065, s: 1.25, pose: track([[22.4, P.fear], [22.6, P.peek, 'out'], [22.85, P.surprised]])(T), f: -1, emo: '?', emoK: win(T, 22.6, 22.75) }, T);
  }],
  // 22. Все вместе жмут кнопку
  [23.0, 24.4, T => { setCam(640, 1000, 1.55, true); drawBG('bg5', true);
    const bx = 690, by = 930;
    [[430, 1130, 1.25, -1], [520, 1090, 1.05, 0], [560, 1150, 1.3, 1]].forEach(([x, y, s, j], i) => drawStick({ x: x + 30 * j * E.out(win(T, 23.1, 23.6)), y, s, pose: track([[23.0, P.angry], [23.5, P.reachIn, 'out']])(T), ghost: true, angry: 1 }, T + i));
    drawStick({ x: 830, y: 1065, s: 1.25, pose: tremble(P.surprised, 2), f: -1, emo: '!?', emoK: 1 }, T);
    drawButton(bx, by, .75 * (1 - .25 * pulse(T, 24.1, 24.35)), '−5 SEC', true, { flash: T > 24.15 });
    if (T > 24.15) drawBurst(bx, by, win(T, 24.15, 24.4), '#fff', 14, 80, 30);
  }],
  // 23. Неоновые часы: время пошло назад
  [24.4, 25.0, T => { setCam(540, 960, 1.0, true); drawBG('bg5', true); ctx.fillStyle = 'rgba(20,0,30,.55)'; ctx.fillRect(0, 0, W, H);
    neonClock(540, 900, .8 + .3 * E.out(win(T, 24.4, 25.0)), -T * 14);
  }],
  // — 25.0–27.4: перемотка (кадры выше назад, см. drawFrame) —
  // 24. Снова начало: выдох облегчения
  [27.4, 28.3, T => { setCam(540, 980, 1.05); drawBG('bg0');
    drawStick({ x: 255, y: g0(255), s: H1, pose: track([[27.4, P.walk], [27.6, P.stand], [27.75, P.exhale], [28.2, P.exhale]])(T) }, T);
    if (T > 27.75) drawPuff(255 + 70, g0(255) - 330, win(T, 27.75, 28.25));
  }],
  // 25. Снова кнопка
  [28.3, 28.75, T => { setCam(330, 930, 1.75); drawBG('bg0');
    drawStick({ x: 255, y: g0(255), s: H1, pose: track([[28.3, P.stand], [28.5, { ...P.stand, h: -20 }]])(T), emo: '...', emoK: win(T, 28.45, 28.6) }, T);
    drawButton(390, 760, btnScale(T, 28.32, null, 99) * .5, '+5 SEC', false);
  }],
  // 26. Крупно: взгляд в камеру, жест, кнопка «обиделась» и исчезла
  [28.75, 29.65, T => { setCam(320, 820, 2.5); drawBG('bg0');
    drawStick({ x: 255, y: g0(255), s: H1, pose: track([[28.75, P.stand], [28.95, P.raise, 'out']])(T), eyes: 1, finger: E.back(win(T, 28.95, 29.15)) }, T);
    const wr = win(T, 29.15, 29.4);
    if (T < 29.4) drawButton(400, 760, .45 * (1 - .3 * wr), '+5 SEC', false, { sx: 1 + .06 * Math.sin(T * 60) * wr, sy: 1 - .25 * wr, rot: -8 * wr });
    else if (T < 29.52) drawButton(400, 760, .42, '+5 SEC', false, { dashed: true });
    if (T > 29.48) drawBurst(400, 760, win(T, 29.48, 29.65), RED, 12, 40, 26);
  }],
  // 27. Общий: снова идёт — кадр совпадает с началом (петля)
  [29.65, 30.01, T => { setCam(540, 980, 1.05); drawBG('bg0');
    const x = 150 - (30 - T) * 370; drawStick({ x, y: g0(Math.max(0, x)), s: H1, pose: P.walk }, T);
  }],
];

// пропуски (глитч) — по времени мира
const SKIPS = [[3.9, 4.3, 1], [9.88, 10.12, 1], ...[13.95, 14.75, 15.55, 16.35].map(t => [t + .18, t + .32, .8])];
function shotAt(T) { for (let i = SHOTS.length - 1; i >= 0; i--) if (T >= SHOTS[i][0]) return SHOTS[i]; return SHOTS[0]; }
function drawFrame(t) {
  let T = t, rew = 0;
  if (t >= 25.0 && t < 27.4) { rew = win(t, 25.0, 27.4); T = 24.3 - (24.3 - 0.35) * E.io(rew); }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  // тряска камеры
  const shake = 16 * pulse(T, 10.14, 10.4) + 10 * pulse(T, 19.2, 19.4) + 18 * pulse(T, 24.15, 24.5) + (rew ? 12 * Math.sin(rew * Math.PI) : 0);
  ctx.save();
  if (shake > 0) ctx.translate(Math.sin(t * 97) * shake, Math.cos(t * 83) * shake);
  const shot = shotAt(T); shot[2](T);
  ctx.restore();
  if (!rew) for (const [a, b, amp] of SKIPS) { const k = win(T, a, b); if (k > 0 && k < 1) skipFX(Math.sin(k * Math.PI) * amp, t, false); }
  if (t >= 24.4 && t < 25) skipFX(.5 * win(t, 24.4, 25), t, true);
  if (rew) { skipFX(.7 + .3 * Math.sin(rew * Math.PI), t, true); ctx.setTransform(1, 0, 0, 1, 0, 0); neonClock(540, 900, .55, -t * 25); }
  flash(.85 * pulse(T, 24.15, 24.3) * (rew ? 0 : 1) + .18 * pulse(T, 3.64, 3.74));
  vignette();
}
window.renderFrame = t => drawFrame(Math.min(t, 29.999));
window.READY = Promise.all([BG_READY, document.fonts.load('900 54px Inter')]).then(() => drawFrame(0));
</script>

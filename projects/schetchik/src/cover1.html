  txt('МНЕ ЗАПЛАТИЛИ', CXC, 1310, 72, T.text, { weight: 900, align: 'center', stroke: 14 }); txt('ЧУЖОЙ ЖИЗНЬЮ', CXC, 1395, 72, T.danger, { weight: 900, align: 'center', stroke: 14 }); }
